hese services plus a more sophisticated client is a very powerful marriage.\nYeah. Well, and an iPhone.\nI do.\nYes.\nYou know, it’s interesting. The PC has proved to be very resilient because, as Bill said earlier, I mean, the death of the PC has been predicted every few years.\nI mean, personal computer in general.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And, you know, there was the age of productivity, if you will, you know, the spreadsheets and word processors and that kind of got the whole industry moving. And it kind of plateaued for a while and was getting a little stale and then the Internet came along and everybody needed more powerful computers to get on the Internet, browsers came along, and it was this whole Internet age that came along, access to the Internet. And then some number of years ago, you could start to see that the PC that was taken for granted, things had kind of plateaued a little bit, innovation-wise, at least.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And then I think this whole notion of the PC–we called it the digital hub, but you can call it anything you want, sort of the multimedia center of the house, started to take off with digital cameras and digital camcorders and sharing things over the Internet and kind of needing a repository for all that stuff and it was reborn again as sort of the hub of your digital life.\nAnd you can sort of see that there’s something starting again. It’s not clear exactly what it is, but it will be the PC maybe used a little more tightly coupled with some back-end Internet services and some things like that. And, of course, PCs are going mobile in an ever greater degree.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "So I think the PC is going to continue. This general purpose device is going to continue to be with us and morph with us, whether it’s a tablet or a notebook or, you know, a big curved desktop that you have at your house or whatever it might be. So I think that’ll be something that most people have, at least in this society. In others, maybe not, but certainly in this one.\nBut then there’s an explosion that’s starting to happen in what you call post-PC devices, right? You can call the iPod one of them. There’s a lot of things that are not…\nWhat?\nWhy?\nOkay. Well, anyway, I think there’s just a category of devices that aren’t as general purpose, that are really more focused on specific functions, whether they’re phones or iPods or Zunes or what have you. And I think that category of devices is going to continue to be very innovative and we’re going to see lots of them.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Well, an iPod as a post-PC…\nA phone as a post-PC device.\nWe’re getting to the point where everything’s a computer in a different form factor. So what, right? So what if it’s built with a computer inside it? It doesn’t matter. It’s, what is it? How do you use it? You know, how does the consumer approach it? And so who cares what’s inside it anymore?\nI don’t know. And the reason I don’t know is because I wouldn’t have thought that there would have been maps on it five years ago, but something comes along, gets really popular, people love it, get used to it, you want it on there.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "So people are inventing things constantly and I think the art of it is balancing what’s on there and what’s not on there, is the editing function. And clearly, most things you carry with you are communications devices. You want to do some entertainment with them as well, but they’re primarily communications devices and that’s what they’re going to be.\nYou know, we’re working on some things that I can’t talk about, but…\nAgain, yeah.\nThere used to be a saying, isn’t it at Apple …\nThere used to be a saying at Apple, isn’t it funny, a ship that leaks from the top. So the…\nThat was what they used to say about me when I was in my 20s.\nThere’s a zillion interesting things going on on the Internet. The most interesting things to me are these incredible new services that people are bringing up and…", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "There’s a lot of them surrounding entertainment, but there’s a lot of them that have to do with just sort of figuring how to navigate through life a little more efficiently. And I think, you know, it’s really great when you show somebody something and you don’t have to convince them they have a problem this solves. They know they have a problem, you can show them something, they go, oh, my God, I need this. And I think you’re going to see a lot of things like that happen over the next year or two.\nI couldn’t agree with you more, and we’ll make up for lost time in the near future.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "See, I look at this a little bit differently, which is, we’re not trying to do a lot of this stuff because it’s not what we do. We don’t think one company can do everything. So you’ve got to partner with people that are really good at stuff. Like, we’re not, I mean, maybe Microsoft is great at search. We’re not. We’re not trying to be great at search so we partner with people that are great at search. And we don’t know how to do maps on the back end. We know how to do the best maps client in the world, but we don’t know how to do the back end so we partner with people that know how to do the back end. And what we want to do is be that consumer’s device and that consumer’s experience wrapped around all this information and things we can deliver to them in a wonderful user interface, in a coherent product.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And so in some cases, you know, we have to do more work than others. You know, in the case of iTunes, there wasn’t a music delivery service that was any good and we had to do one, so we’ll do one. But in other cases, there’s companies doing a way better job because we’re not as good at this stuff as other people are and we’d love to partner with them and so, you know, we selectively do that. And I think it’s really hard for one company to do everything. Life’s complex.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "I mean, I think people want to enjoy their entertainment when they want it and how they want it, on the device that they want it on. So ultimately, that’s going to drive the entertainment companies into all sorts of different business models. And that’s a good thing. I mean, if you’re a content company, that’s a great thing. More people wanting to, you know, enjoy your content more often in more different ways, that’s why you’re in business, but the transitions are hard sometimes.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And, you know, the music industry, it turned out that the Internet got fast enough to download songs pretty easily. There was no legal alternative and maybe they made some bad choices in how they reacted to that, but, you know, they’re still trying to make the transition to a very different way of doing business, or ways of doing business while they’re under attack from piracy. And we can all highlight some of the mistakes that have been made, but, you know, still, it’s a tough job.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And Hollywood, I think, you know, has watched what’s happened in music, learned some things to do, some things not to do, but, you know, they’re still trying to map this out. How do they make some of these transitions, some new business models, different platforms, allowing their customers way more freedom on when they want to watch stuff and how they want to watch it. And I think there’s a tremendous amount of experimentation and thought going on that’s going to be good. It’s going to be really good if you’re a content owner.\nYeah.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "I know, it’s not fair. But I think the question is a very simple one, which is how much of the really revolutionary things people are going to do in the next five years are done on the PCs or how much of it is really focused on the post-PC devices. And there’s a real temptation to focus it on the post-PC devices because it’s a clean slate and because they’re more focused devices and because, you know, they don’t have the legacy of these zillions of apps that have to run in zillions of markets.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And so I think there’s going to be tremendous revolution, you know, in the experiences of the post-PC devices. Now, the question is how much to do in the PCs. And I think I’m sure Microsoft is–we’re working on some really cool stuff, but some of it has to be tempered a little bit because you do have, you know, these tens of millions, in our case, or hundreds of millions in Bill’s case, users that are familiar with something that, you know, they don’t want a car with six wheels. They like the car with four wheels. They don’t want to drive with a joystick. They like the steering wheel.\nAnd so, you know, you have to, as Bill was saying, in some cases, you have to augment what exists there and in some cases, you can replace things. But I think the radical rethinking of things is going to happen in a lot of these post-PC devices.\nDing.\nWe’ve kept our marriage secret for over a decade now.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "We did.\nHe was 12.\nI haven’t answered.\nNo, that wasn’t my answer. You know, when Bill and I first met each other and worked together in the early days, generally, we were both the youngest guys in the room, right? Individually or together. I’m about six months older than he is, but roughly the same age. And now when we’re working at our respective companies, I don’t know about you, but I’m the oldest guy in the room most of the time. And that’s why I love being here.\nAnd, you know, I think of most things in life as either a Bob Dylan or a Beatles song, but there’s that one line in that one Beatles song, “you and I have memories longer than the road that stretches out ahead.” And that’s clearly true here.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Boy, we’ve got some pretty big problems and I think most of them are much bigger than anything Silicon Valley can contribute right now to solve. So hopefully some of those will get solved. I also think we underestimate how much all of our industry depends on stability. We’ve enjoyed, you know, a long period of stability and we’ve been able to focus on technology and growing our businesses and stuff and I think we take that for granted sometimes.\nOne of the more interesting areas that we all suffer from, of course, is in the area of energy dependency. And there’s a lot of work going on, I know a lot of investing going on, anyway, I don’t know if the results are there, but a lot of investing going on in alternative energy and maybe Silicon Valley can play a small role in some of that stuff, too.\nNo.\nYeah, just appreciating.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Well, I think Bill and I would agree that we can get it down to two. No, I think it’s hard to limit imagination and innovation. I think there’s always going to be a bunch of new, great things. And I think that’s part of what we put up with to get the innovation. We put up with a little bit of aggravation to get the innovation.\nAnd then letting it come back sometimes.\nSo your question was about whether I wish I didn’t have to go into Apple every day?\nOh, no. I think the world’s…\nI think the world’s a better place because Bill realized that his goal isn’t to be the richest guy in the cemetery, right? That’s a good thing and so he’s doing a lot of good with the money that he made.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "You know, I’m sure Bill was like me in this way. I mean, I grew up fairly middle-class, lower middle-class, and I never really cared much about money. And Apple was so successful early on in life that I was very lucky that I didn’t have to care about money then. And so I’ve been able to focus on work and then later on, my family.\nAnd I sort of look at us as two of the luckiest guys on the planet because we found what we loved to do and we were at the right place at the right time and we’ve gotten to go to work every day with super bright people for 30 years and do what we love doing.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And so it’s hard to be happier than that. You know, your family and that. What more can you ask for? And so I don’t think about legacy much. I just think about being able to get up every day and go in and hang around these great people and hopefully create something that other people will love as much as we do. And if we can do that, that’s great.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Yeah. People say you have to have a lot of passion for what you’re doing and it’s totally true. And the reason is because it’s so hard that if you don’t, any rational person would give up. It’s really hard. And you have to do it over a sustained period of time. So if you don’t love it, if you’re not having fun doing it, you don’t really love it, you’re going to give up. And that’s what happens to most people, actually. If you really look at the ones that ended up, you know, being “successful” in the eyes of society and the ones that didn’t, oftentimes, it’s the ones [who] were successful loved what they did so they could persevere, you know, when it got really tough. And the ones that didn’t love it quit because they’re sane, right? Who would want to put up with this stuff if you don’t love it?", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "So it’s a lot of hard work and it’s a lot of worrying constantly and if you don’t love it, you’re going to fail. So you’ve got to love it and you’ve got to have passion and I think that’s the high-order bit.\nThe second thing is, you’ve got to be a really good talent scout because no matter how smart you are, you need a team of great people and you’ve got to figure out how to size people up fairly quickly, make decisions without knowing people too well and hire them and, you know, see how you do and refine your intuition and be able to help, you know, build an organization that can eventually just, you know, build itself because you need great people around you.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "You know, because Woz and I started the company based on doing the whole banana, we weren’t so good at partnering with people. And, you know, actually, the funny thing is, Microsoft’s one of the few companies we were able to partner with that actually worked for both companies. And we weren’t so good at that, where Bill and Microsoft were really good at it because they didn’t make the whole thing in the early days and they learned how to partner with people really well.\nAnd I think if Apple could have had a little more of that in its DNA, it would have served it extremely well. And I don’t think Apple learned that until, you know, a few decades later.\nWe’re not that old yet.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Oh, not true. I’ll give you one example. So we started building in video cameras into almost all our computers a few years ago. And the response by people of all ages, but in particular seniors, has been off the charts because they’re buying these things now and they’re buying them for their grandkids, their sons and daughters with their grandkids so they can stay in touch with their grandkids. And they’re videoconferencing more than younger people are. And it’s incredible what this has done. So that’s just one simple example, but there’s, like, dozens of them that have clicked with, you know, seniors that are living independently that want to stay in touch with extended families and do other things like that.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "I’ll give you another example. We’ve got a little shy of 200 retail stores now. And one of the things that stores are doing is personal training now. It’s called one-to-one. And we are up to now a run rate of a million personal training sessions–they last an hour–per year. A million per year.\nYeah, we started about a year ago and we’re up to a million training sessions per year run rate now. And a lot of those folks–some of them, anyway, many of them–are seniors. And they’re coming in and they’re spending an hour learning how to use Office and they’re spending an hour learning how to video-conference. They can basically come in as much as they want and they can schedule these things throughout a year and they pay $99, I think, a year for it. And it’s been great.\nI want Star Trek. Just give me Star Trek.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "I don’t know. And that’s what makes it exciting to go into work every day, because there’s–as we talked about earlier, this is an extraordinarily exciting time in the industry, and lots of new stuff happening. So, you know, I can’t even begin to think what it’s going to be like 10 years from now.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Good morning. Introductions are really funny. They paid me $60 so I wore a tie. How many people, how many of you are 36 years, older than 36 years old? Yeah. You were born pre-computer. The computer is 36 years old. And there’s something sort of, I think that there’s going to be a little slice in the timeline of history as we look back. Pretty meaningful slice right there.\nA lot of you are products of the television generation. I’m pretty much a product of the television generation, but to some extent starting to be a product of the computer generation, and the kids growing up now are definitely products of the computer generation, and in their lifetimes, the computer will become the predominant medium of communication, just as the television took over from the radio, took over from even the book.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Boy, I’ll talk about anything you want to talk about today. I have about 15 or 20 minutes of stuff that I just wanted to cover really quickly, and then whatever you want to talk about, we can talk about. How’s that? Yeah.\nHow many of you own an Apple? Any? Or just any personal computer? Uh-oh. How many of you have used one or seen one? Anything like that? Good. Okay.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Let’s start off with what is a computer? What is a computer? It’s really simple. It’s just a simple machine, but it’s a new type of machine. The gears, the pistons have been replaced with electrons. How many of you have ever seen an electron? That’s the problem with computers, is that you can’t get your hands on the actual things that are moving around. You can’t see them, and so they tend to be very intimidating, because in a very small space there’s billions of electrons running around, and we can’t really get a hold on exactly what they look like.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Computers are very adaptive. It’s a very adaptive machine. We can move the electrons around differently to different places, depending upon the current state of affairs, the results of the last time we moved the electrons around. So if you were here last night and you heard about the brain and how it’s very adaptive, a computer is in the same way very, very adaptive.\nSecond thing about a computer, it’s very new. It was invented 36 years ago in 1947. The world’s first degree in computer science offered by a university, which was the University of California at Berkeley, and it was a master’s degree, was offered in 1968, which means the oldest person that has a degree in computer science is 39 years old, and the average age of professionals at Apple is under 30. So it’s a field that’s dominated by fairly young people.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Third thing about computers, they’re really dumb. They’re exceptionally simple, but they’re really fast. The raw instructions that we have to feed these little microprocessors, even the raw instructions that we have to feed these giant Cray-1 supercomputers are the most trivial of instructions. They’re get some data from here, get a number from here, fetch a number, add two numbers together, test to see if it’s bigger than zero, go put it over there. It’s the most mundane thing you could ever imagine.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "But the key thing about it is that, let’s say I could move 100 times faster than anyone in here. In the blink of your eye, I could run out there and I could grab a bouquet of fresh spring flowers or something, and I could run back in here and I could snap my fingers, and you’d all think I was a magician or something. And yet, I was basically doing a series of really simple instructions, moving, running out there, grabbing some flowers, running back, snapping my fingers, but I could just do them so fast that you would think that there was something magical going, and it’s the exact same way with the computer.\nIt can go grab these numbers and add them together and throw them over here. At the rate of about a million instructions per second. And so we tend to think there’s something magical going on, when in reality there’s just a series of these simple instructions.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Now, what we do is we take these very, very simple instructions and we, by building a collection of these things, build a higher level instruction. So instead of saying, turn right, left foot, right foot, left foot, right foot, extend hand, grab flowers, run back, I can say, could you go get some flowers? Could you pour a cup of coffee? And we have started in the last 20 years to deal with computers in higher and higher levels of abstraction. But ultimately, these levels of abstraction get translated down into these stupid instructions that run really fast.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Let’s look at the brief history of computers. Best way to understand it is probably an analogy. Take the electric motor. The electric motor was first invented in the late 1800s, and when it was first invented, it was only possible to build a very, very large one, which meant that it could only be cost justified for very large applications. And therefore, electric motors did not proliferate very fast at all.\nBut the next breakthrough was when somebody took one of these large electric motors and they ran a shaft through the middle of a factory and through a series of belts and pulleys brought, shared the horsepower of this one large electric motor on 15 or 20 medium-sized workstations, thereby allowing one electric motor to be cost justified on some medium-scale tasks, and electric motors proliferated even further then.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "But the real breakthrough was the invention of the fractional horsepower electric motor. We could then bring the horsepower directly to where it was needed and cost justify it on a totally individual application.\nAnd I think there’s about 55 or so fractional horsepower motors now in every household.\nIf we look at the development of computers, we see a real parallel. We look, the first computer was called the ENIAC in 1947. It was developed particularly for ballistic military calculations. It was giant. Hardly anyone got a chance to use it.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "The real breakthrough, the next real breakthrough, was in the 60s with the invention of what was called time sharing. And what we did was we took one of these very large computers and we shared it. Since it could execute so many instructions so quickly, we’d run some on Fred’s job over here and then we’d run some on Sally’s job and we’d run some on Don’s job and we’d run some on Susie’s job. And we’d share this thing and it was so fast that everyone would think they had the whole computer to themselves.\nTime sharing was what really started to proliferate computers in the 60s. And most of you, if you’ve used computer terminals connected with some umbilical cord to some large computer somewhere else, that’s time sharing. That’s what got computers on college campuses in large numbers.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "The reason Apple exists is because we stumbled on to fractional horsepower computing five years before anybody else. That’s the reason we exist. We took these microprocessor chips, which is sort of a computer on a chip, and we surrounded it with all the other stuff you need to interact with a computer and we made a computer that was about 13 pounds. And people would look at it and they’d say, well, where’s the computer? This is just the terminal. We’d say, no, that is the computer. And after about five minutes of repeating this, they’d finally, a light bulb would go on in their minds and they’d decide if they didn’t like it, they could throw it out the window or run over it with their car, but that this was the entire computer. That’s why we exist.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Fractional horsepower computing. Because fractional horsepower computing has created a revolution. It was invented in 1976, the first personal computer. This year, in 1983, the industry is going to ship over three million of the little buggers. Three million. By 1986, we’re going to ship more computers than automobiles in this country.\nLet me digress for a minute. One of the reasons I’m here is because I need your help. If you’ve looked at computers, they look like garbage. All the great product designers are off designing automobiles or they’re off designing buildings, but hardly any of them are designing computers. And if we take a look, we’re going to sell those three million computers this year. We’re going to sell those 10 million computers in 86, whether they look like a piece of shit or they look great.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "It doesn’t really matter because people are going to just suck this stuff up so fast that they’re going to do it no matter what it looks like. And it doesn’t cost any more money to make it look great. There are going to be these objects, this new object that’s going to be in everyone’s working environment and it’s going to be in everyone’s educational environment and it’s going to be in everyone’s home environment. And we have a shot at putting a great object there, or if we don’t, we’re going to put one more piece of junk object there.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "By 1986, 1987, take a year, people are going to be spending more time interacting with these machines than they do interacting with their big automobile machines today. People are going to be spending two, three hours a day sometimes interacting with these machines, longer than they spend in a car. And so the industrial design, the software design and how people interact with these things certainly must be given the consideration that we give automobiles today, if not a lot more.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And if you take a look, what we’ve got is we’ve got a situation where most of the automobiles are not being designed in the United States, Europe, Japan. Televisions, audio electronics, watches, cameras, bicycles, calculators, you name it, most of the objects of our life are not designed in America. We’ve blown it. We’ve blown it from an industrial point of view because we’ve lost the markets to the foreign competitors. We’ve also blown it in the design point of view.\nAnd I think we have a chance, focusing on this new computing technology, meeting people in the 80s. The fact that computers and society are out on a first date in the 80s. We have a chance to make these things beautiful and we have a chance to communicate something through the design of the objects themselves.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "In addition to that, we’re going to spend over $100 million in the next 12 months on media advertising. Apple alone, IBM will spend at least an equivalent amount. And we generate tens of millions of dollars worth of brochures, posters, more than the auto industry, again, as a comparison. And this stuff can either be great or it can be lousy. And we need help. We really, really need your help.\nOkay, let’s go back to this revolution. What is happening? What’s happening is the personal computer is a new medium of communication, one of the media. So what’s a media? It’s a technology communication. A book is a medium, telephone, radio, television. These are mediums of communication and each medium has pitfalls to it, has shortcomings, has boundaries which you can’t cross, but it also generally has some new unique opportunities.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "The neat thing is that each medium shapes not only the communication that goes through it, but it shapes the process of communication. Perfect example. If you compare the telephone to what we’re seeing now in electronic mail, where we link a bunch of computers together and we can send messages to an electronic mailbox, which people can then receive at their leisure. We see that, indeed, in one sense we’re sending voice through these wires and in another sense we’re sending ones and zeros through these wires.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "So the content that’s traveling through the medium is certainly different. But the most interesting thing that’s different is the process of communication. When I talk on a telephone with anyone, we both have to be on the phone at the same time. When I’m working or when I want to send something to somebody with a computer terminal, I want to do a drawing and zip it over and put it in their mailbox. They don’t need to be there. They can retrieve it at 12 a.m. in the morning. They can retrieve it three days later. They can be in New York and retrieve it.\nOne of these days when we have portable computers with radio links, they can be walking around Aspen and retrieve it. And so the process of communication itself changes as the mediums evolve. So what I’m claiming is that computers are a medium and that personal computers are a new and different medium from large computers.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "What happens when a new medium enters the scene is that we tend to fall back into old media habits. And let’s look at a few transitions from one medium to another. Radio to television, television to this incredible new interactive medium of the video disc. If you go back and you look at the first television shows, they’re basically radio shows with a television camera pointed at them. And it took us the better part of the 50s to really understand how television was going to come into its own as its own medium.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And I really think the first time that a lot of people were shook into realizing that television had come of age was the JFK funeral. The nation, a lot of the world experienced the JFK funeral in their living room at a level of intensity that wouldn’t have been possible with radio. I think another more upbeat example was the Apollo landing. That experience was not possible with the previous medium and yet it took us the better part of 20 years for that one to really evolve.\nLet’s look at the next transition. We have this optical video disc which can store 55,000 images on a slide or an hour of video randomly accessible. What are we using it for? Movies. We’re dropping back into the old media habits. And there’s a few experiments though that are starting to happen and you start to believe that five years, ten years from now that’s going to come into its own.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "A neat experiment happened right here in Aspen. MIT came out to Aspen about four or five years, I think about four years ago, and they had this truck with this camera on it and they went down every single street, photographed every single intersection in every single street in Aspen. They photographed all the buildings and they’ve got this computer and this video disc hooked up together and on the screen you see yourself looking down a street and you can touch the screen and there’s some arrows on the screen and you can touch walk forward and all of a sudden it’s just like you’re walking forward in the street.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And you get to an intersection and you can stop and you can look right and you can look straight and you can look left and you can decide which way you want to go. You can even go in some of the shops. It’s an electronic map that gives you the feeling you’re walking through Aspen. Then there’s four little buttons in the corner because they came back and they did exactly the same thing all four seasons. So you can be looking down a street, hit winter, all of a sudden you get the same street with three feet of snow on it. It’s really amazing.\nThat’s not incredibly useful. But it points to some of the interactive nature of this new medium which is just starting to break out from movies and it’s going to take another five to ten years to evolve.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Okay, let’s go back to computers. We’re in the I Love Lucy stage right now in our medium development. What we did was microcomputers, personal computers, first come on the scene. What do we do? We fall back into old media habits. We run these weird languages like COBOL.\nWe do business accounting on them. That’s the kind of stuff we have been doing on them historically. It took us about four years before we started breaking out of that and we’re just starting to break out of it now. When you look at Lisa, Lisa enables a person like me.\nI’m not an artist in the sense that many of you are. I can sit down and I can draw artistic pictures with that thing because there’s a program called Lisa Draw and if I don’t like what I’ve just drawn, I can erase it. I can move it. I can shrink it. I can grow it. I can change its texture. There’s a little airbrush. The more I scrub, the darker it gets.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "I can put soft edges on things, hard edges on things. And so I, I have no talent at drawing at all, can make neat drawings and then I can cut them out and I can paste them into my documents so that I can combine pictures and words. And then I can send it onto the electronic mailbox so somebody else that’s living here in Aspen can dial up a phone number and get their mail and see this drawing that I made. So we’re starting to break out and you can just see it now and it’s really exciting.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "So where we are is that the personal computer is a new medium and that society and computers are really meeting for the first time in the 80s. In 15 years, it’s going to be all over in terms of this first phase, getting these tools out into society in large numbers. But during the next 15 years, if we really, we have an opportunity to do it great or to do it so-so. And what a lot of us at Apple are working on is trying to do it great.\nWe’ll look at one last thing and we can talk about whatever you want to talk about. What is a computer program? Do you know what a computer program is? Anybody?\nNo? Sort of? Sort of. It’s an odd thing. It’s really an odd thing. It’s, you can’t, I mean, you’ve never seen an electron, but computer programs have no physical manifestation at all. They’re simply ideas expressed on paper. Computer programs are archetypal.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "What do I mean by that? Let’s compare computer programming to television programming. Again, if you go back and you look at the tapes of the JFK funeral in 1963, I guess, you’ll start to cry. You will feel a lot of the same feelings you felt when you were watching that 20 years ago.\nWhy? Because through the art of television programming, we are very good at capturing a set of experiences, an experience, two experiences, 20 experiences, and being able to recreate them. We’re very good at that. It doesn’t take a lot of money, and it’s somewhat limited, but we can do a pretty good job of that.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "You can really feel the excitement of Neil Armstrong landing on the moon. Computer programming does something a little different. What computer programming does is it captures the underlying principles of an experience. Not the experience itself, but the underlying principles of the experience, and those principles can enable thousands of different experiences that all follow those laws, if you will.\nAnd the perfect example is the video game. What does the video game do? It follows the laws of gravity, of angular momentum, and it sets up this stupid little pong game, but the ball always follows these laws. No two pong games are ever the same, and yet every single pong game follows these underlying principles.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "I’ll give you another example. There’s a neat program called Hammurabi, and Hammurabi, there’s seven-year-old kids playing this. And it’s a game, and he comes up on the screen, and he goes, and you’re King Hammurabi. He goes, oh, King Hammurabi.\nAnd you get to be King Hammurabi of the ancient kingdom of Sumeria for ten years. He goes, oh, King Hammurabi, this is year one. You have a thousand bushels of weed in storage, you have a hundred people, and you have a hundred acres of land. Land is trading at twenty-four bushels an acre.\nWould you like to sell any land? No. Would you like to buy any land? No.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "How much would you like to plant? And it turns out that if you don’t plant enough, some of your people will starve the next year. And if you plant a lot, then people will come from the surrounding villages, because you’ve got a hot village to live in, and you feed them well. So you plant a certain amount, but you need to, then it says how much, oh, I’m sorry.\nSo you feed your people a certain amount, and then it asks you how much would you like to plant. And you have to plant so much as well in order to get the grain the next year. But you can’t plant more acres than you have people to plant the acres. And so if you go on a land-buying spree at the beginning, and you don’t feed your people well because you spent all your grain buying land, then you don’t have the people to plant the land.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "So it doesn’t do you any good. If you don’t plant the land, and you feed your people a ton, all these other people come from the surrounding villages, but they starve the next year. And there are these seven-year-olds, and it goes on year two, year three, and every once in a while it throws in the rats, ate some of the grain, and you’re in deep trouble. What are you going to do?\nKill some people, or sell some land, or whatever. And it’s crude. But basically there are these seven-year-old kids playing with this macroeconomic model. And you can argue about the content of the model, but one thing you can’t argue about, they will sit there for hours and play that and learn.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And we’ve got to get our models better and better and more sophisticated, but that is an interactive way of learning that none of us ever had when we were growing up. And again, thousands of individual experiences, but all based on that one set of underlying principles. When I was going to school, I had a few great teachers and a lot of mediocre teachers, and the thing that probably kept me out of jail was books, because I could go read what Aristotle wrote or what Plato wrote, and I didn’t have to have an intermediary in the way. And a book was a phenomenal thing.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "It got right from the source to the destination without anything in the middle. The problem was, you can’t ask Aristotle a question. And I think as we look towards the next 50 to 100 years, if we really can come up with these machines that can capture an underlying spirit or an underlying set of principles or an underlying way of looking at the world, then when the next Aristotle comes around, maybe if he carries around one of these machines with him his whole life, his or her whole life, and types in all this stuff, then maybe someday after the person’s dead and gone, we can ask this machine, hey, what would Aristotle have said? What about this?\nAnd maybe we won’t get the right answer, but maybe we will. And that’s really exciting to me. And that’s one of the reasons I’m doing what I’m doing. So what do you want to talk about?\nYeah. Yeah, it’s a mess. Okay. Okay.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "How are these computers all going to work together? They’re going to probably work together a lot like people. Sometimes they’re going to work together really well, and other times they’re not going to work together so well. What we’ve got now is we are putting a lot of computers out that are made to be used pretty much in what we call a standalone mode.\nOne person, one computer. But it isn’t very long before you get a community of users using these things that really want to hook them all together, because ultimately a computer is going to be a tool for communication. So they want to hook them together and communicate. And over the next five years, the standards for doing this are going to evolve.\nThey all speak different languages right now. And there’s a… I heard a funny story. We’ve talked a lot with AT&T, American Bell, etc.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And there’s a funny story about the… this is a true story. When the old… I talked to this old guy who was about 80 years old. And he was one of the original telephone installers. And he would go out and he’d install telephones in people in farmhouses. And they’d never seen anything like this. And it takes two wires.\nHe’d run the two wires down and he’d hook up the phone. And he was out installing this phone for this Italian family in this farm. And he finished installing the phone. And the guy asked him, well, can I speak Italian on this phone?\nAnd he said, why didn’t you tell me? I’ve got to run a third wire. It’ll be $50 extra. So that’s where we are today.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And… What happened, there’s been a few installations where people have hooked these things together. The one installation that stands out is a Xerox did it at a place called Palo Alto Research Center, or PARC for short. And they hooked about 100 computers together on what’s called a local area network, which is just a cable that carries all this information back and forth.\nAnd an interesting thing happened when they did that. What happened was that you’d have a distribution list. So you’d want to send a memo to all the people in this group. And so you’d say, okay, you’d write a memo and you’d send it to the distribution list for all the people interested in the November forecast or a new product delta or whatever you’re working on.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "But then an interesting thing happened. There were 20 people and they were interested in volleyball. So a volleyball distribution list evolved. The volleyball game next week was changed. You’d write a quick memo and send it to the volleyball distribution list. Then there was a Chinese food cooking list. And before long, there were more lists than people. And it was a very, very interesting phenomenon because I think that that’s exactly what’s going to happen, is that as we start to tie these things together, they’re going to facilitate communication and facilitate bringing people together in the special interests that they have.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "We’re about five years away from really solving the problems of hooking these computers together in the office. And we’re about 10 to 15 years away of solving the problems of hooking them together in the home. And a lot of people are working on it, but it’s a pretty fierce problem. Now, Apple’s strategy is really simple.\nWhat we want to do is we want to put an incredibly great computer in a book that you can carry around with you that you can learn how to use in 20 minutes. That’s what we want to do, and we want to do it this decade. And we really want to do it with a radio link in it, so you don’t have to hook up to anything. You’re in communication with all these larger databases and other computers.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "We don’t know how to do that now. It’s impossible technically. So we had three options. One was to do nothing. And as I mentioned, we’re all pretty young and impatient, so that was not a good option. The second one was to put a piece of garbage computer in a book. And we can do that, but our competitors are doing that, and so we don’t need to do that. The third option was to design the computer that we want to put into the book eventually, even though we can’t put it into the book now.\nAnd right now, it fits in a bread box, and it’s $10,000, and it’s called Lisa. And it just so turns out that fortunately, there is a giant office market out there that is buying these things a lot faster than we can make them. We’re sold out for the next year. And we’ll sell over $100 million of those things for the first year.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "So fortunately, there is an office marketplace where enhancing personal productivity is absolutely worth $10,000 a person. And they’re gobbling these things up, and they will pay for the development of this new technology. The next thing we will do is we will find a way to put it in a shoebox and sell it for like $2,500. And that’ll be the next step.\nAnd finally, we’ll find a way to get it in a book and sell it for under $1,000. And we will be there within five to seven years. And that’s what we’re working pretty singularly on.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Yeah, it is a little crude. Right. Okay. That’s what we’re planning to do to sort of be able to provide tools for graphic design. That’ll never be our fort. Our fort is going to be just people. And relative to nothing, what we can give them in the next five years is a lot. And eventually we’ll get to the point where people can create images that are as good as they could create any other way.\nBut it’s going to take the better part of this decade to be able to get it down to a price level that people can afford. Let me change some things now. Every computer to date has used a weird type on the screen, as you know. The I’s are just as wide as the W’s. They’re non-proportionally spaced fonts. We call them. You call them. And it’s really been impossible to use multiple fonts on the screen at any given time.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Matter of fact, the fonts have been just garbage. And it’s really been impossible to embed any kind of graphics with text. If you take a look at Lisa, it is totally proportionally spaced text. We have 30, 40 fonts on the screen that come out at approximately 80 dots per inch resolution on the screen, approximately up to 300 dots per inch resolution on a laser printer.\nAnd that’s where we are today. And what you’re saying is we really want to go to 6, 7, 800 dots per inch on a laser film printer. We’re not there yet. We’re solving the problems of injecting some liberal arts into these computers. That’s what we’re trying to do right now. Let’s get proportionally spaced fonts in there. Let’s get multiple fonts in there. Let’s get graphics in there so that we can deal in pictures.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And let’s get to the point where three years from now when somebody… There is going to be no college student three or four years from now that’s ever going to think of writing a paper without one of these things. Just like they will not think of going to a science class without a calculator today. And where we’ve got to get to is where people three, four years from now are using these things and they go, wasn’t this the way it always was?\nThat’s where we’re trying to get to now. Once we get to there, then we can look at some of the other stuff. Yeah?\nYeah, I only heard part of the… You’re talking about the people having these big databases about your life? It’s a privacy issue. Okay. I guess what I see now is an incredible amount of information but not a very great ability to distill any sort of knowledge or wisdom out of that information.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "We are all bombarded with information every day and there is so much information in data banks, in congressional budgets, in testimony, in books, journal articles being published every day. And our ability to turn all that information, to filter it to what we’re interested in and to turn it into something useful to us, into some knowledge, is very low. So I think if we’re really interested in a distributed society where the ability to understand things and the ability to distill knowledge from information the first thing we’ve got to do is give tools to people to help them do that. Because right now, those tools are centralized.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Do you see what I’m saying? So I think the first step towards ensuring that we don’t get a concentration of something that you don’t want is to distribute that intelligence, if you will, that can turn all this information into some sort of knowledge for us. So that we can get on and we can look at any congressional testimony that has to do with gun control, any journal articles published, any newspaper articles published, so that I can come home and on a weekend peruse the weekly outpouring of information but put a filter on it because I’m only interested in gun control. And I can find out that my congressman gave some testimony last week about gun control that I didn’t agree with.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "So I can get on and write him a pretty nasty letter and zing it on the email system and make sure that at least one of his aides will read it tomorrow. And I think that that probably is a lot more important than worrying about these global databases. I don’t think that you’re going to find… We’re moving rapidly into an era of electronic funds transfer.\nAnd I think that’s probably the thing that people are most concerned about right now. Because you could keep a history of our whereabouts and things like that just based on financial transactions. And I think that’s the thing people are most concerned about right now. But I haven’t heard a ton of issues concerning these giant databases knowing everything about us that had much substance to them.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "The thing I’m most concerned with is the ability to turn all this stuff into something we can do something about. Does that make any sense? I didn’t get much sleep last night so I’m a little fuzzy. Yeah.\nAh, public service. We don’t do things because we think they’re public services. We do them because we think they ought to be done, I guess. We do them because we want to do them.\nWe’re doing a few things. The first thing we’re doing is… There’s a situation that’s occurring in schools right now. In that… This all started… The former governor of California, Governor Brown, started this thing called the California Commission on Industrial Innovation in 1980. It turns out we’ll do about a billion dollars this year. And we have a business plan that looks out five years.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "It’s not always accurate but it shows us the trends, shows us the general directions, shows us some of the pitfalls. California is a… Oh, 22… I think $300 billion economy. GNP, basically, is associated with California. And California doesn’t have anything. There isn’t one scrap of paper. There didn’t used to be one scrap of paper written down.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "So Governor Brown got all these people together and said, we’ve got to figure out where we’re going because we don’t want to have a planned economy but we need the infrastructure to support it. And infrastructure takes time to build. So we have to at least understand the trends. If you want to be turning out more engineers next year, you can’t start this year. You have to have started five years ago. You have to train the teachers, etc., etc. So what infrastructure are we going to need to support the growth? Well, the first thing we looked at was employment, jobs.\nAnd what we found was that… about 44% of the new jobs in California in the 1980s come directly and indirectly from high technology. And we looked at that and we said, shit. And what are we going to do to further that and what’s going to hinder that?", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And there were three things that came up, but the biggest one was education, by a long shot. And we looked at the education systems and we are turning out almost as many welders in California as we are computer scientists. And these welders are coming out of school and there ain’t any jobs for them. And this is just a minute example of the problem.\nAnd so one of the things that Apple decided to do… this is not going to make a giant difference, but it could be a catalyst to get something started, is we decided we wanted to give a computer to every school in America. And there’s 100,000 schools in America. And we figured if there was just one there, at least the kids that were interested would somehow find a way to get to it.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And possibly they’d start to understand a little bit about what computers were, maybe integrate them into one or two classes. And so we figured that that would cost approximately $50 million and we’d go broke. So we went to Congress and we said, look, we’ll pay 10 of this if you pay 40 of it. That’s 10 right out of our bank account.\nAnd just to give you a perspective on it, in 1981, Apple made $40 million total after working our butts off for a year. And so we were willing to spend 25% of our 81 profits to do that. And we got very close to getting this passed, but Bob Dole in the Senate killed it because he didn’t really understand it. But California, being the bellwether state it was, passed the same law because we pay California tax.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And so we call the program The Kids Can’t Wait. The kids can’t wait for educational bureaucracy to get around to it. The kids can’t wait for their parents to understand about it and buy them one. So we’re just going to get one in there right now.\nAnd the law got passed in California. There are 10,000 schools in California. The program was announced 60 days ago. And starting next month, we roll out 10,000 computers, one free to every school in California.\nAnd I guess the important thing, though, to restate, this isn’t going to fundamentally change the problem, but at least it’s going to get one computer in there so that if there is a student, especially in one of the schools that can’t afford these things, which is another thing that concerns us, this computer have, computer have not split, at least they’ll get exposure to one. So, yeah.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Oh, well, over half of the gross national product is contributed by companies and people that are already in the information business today. And that’s true. Most of the people that got laid off from General Motors are never going to go back to work at General Motors. Ever, ever, ever.\nAnd unless we retrain them and give them skills, they’re going to burn the cities down. And that’s one of the biggest problems facing us right now. It’s real easy to talk high tech. It’s real hard to take all these guys that have been putting fenders on for 15 years, you know, servicing computers.\nIt’s going to be really hard. And we’re not paying enough attention to it right now. But we’re already in the information age. We’re ready there now. Most of us manipulate information for a living. Yeah?", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Yes. Right. That’s right. Here’s a challenge for you. You want to just make a great contribution, have fun, make zillions of dollars, all at the same time. There are about 20,000 programs for the Apple II.\nFor the IBM PC, which is the second most popular one now, there’s about maybe 2,000 programs. That’s a lot. And you go to buy one of these things and you don’t know what to buy. So you go ask the computer dealer, which one should I buy?\nAnd that person doesn’t know. They’re out selling computers. They’re not looking at software. Instead, they give you a bullshit answer and you buy it. And maybe you’re happy and maybe you’re not. Now, compare that to records. Most people walking into a record store know exactly what record they want to buy. They don’t go up and say, what record should I buy?", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "They know exactly what record they want to buy because there is the phenomenon of the radio station, a free sampling, so that we make our decisions before we go in to the distribution center for the records. We need the equivalent in the software business. We need a software radio station, quote, unquote. And what’s going to happen is, is that I think right now, software is information and the information is expressed with a bunch of ones and zeros.\nAnd what we do now is we take those ones and zeros and we encode them magnetically on this piece of mylar with a bunch of gook on the surface of it that remembers the ones and zeros. We take it and we put it in a package with a manual. We take that, we put it on a truck, we ship it to a dealer. They take it out of the truck.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "They put it on the shelf. It sits there for a while, costing them money. A customer comes in, peruses them, and picks one out, takes it home, shoves it in their computer, and it translates it back to electrical impulses of ones and zeros. Now, I mean, that’s a pretty long path.\nWhere we’ll be going is transmitting this stuff electronically over the phone lines to where when you want to buy a piece of software, we take our ones and zeros, and you ever push a touch-tone phone and you’re, boop, boop, boop, boop, boop, boop, right? We’ll send tones over the phone that the computers will understand and go directly from computer to computer. That’s what we’ll be doing. Once we do that, maybe it’s possible to say, well, we’ll give you 30 seconds of this program for free, or we’ll give you five screenshots.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "We’ll let you play with it for a day. And if you want to buy it, just type in your Visa number, and you got it. I don’t know how we’re going to do it, but we need a radio station. Yeah?\nYeah? Right. Okay. There are two things to do to bring people and computers together. One thing is to make computers easier to use, and the other thing is for people to get more and more familiar with the concepts. How many people here own a Hewlett-Packard calculator? Yeah? Not a lot.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "How many people know about them? Right? Do you know the difference between reverse Polish notation and the way the TI ones work, how the HP ones sort of work backwards? Right? Do you know about that? No? Some of you do, though. Right? Some of you do, maybe. If you had, like, tried to explain that to somebody ten years ago, it would have been just like computers are now. And yet, in ten years, you know, the HP-35 was first introduced in 1972. In ten years, people gradually understand some of these concepts.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "If you’d given one of these Casio watches, which has got 18 alarms and plays music for you and everything else to somebody ten years ago and tried to explain to them how to set the alarm and stuff like that, it wouldn’t have been possible. Automatic bank-telling machines, et cetera, et cetera. So, gradually, the level of technical literacy is rising. The problem is we’re educating people on these garbage devices.\nYou know, setting a Casio watch is really a pain still. So, even though we have products like Lisa, we are still going to need to educate people about what computers are and what they do. But where we’re trying to get is we’re trying to get away from programming. We’ve got to get away from programming because people don’t want to program computers.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "People want to use computers. And so, our strategy right now is let’s write some programs that are generic, that sort of will write 90% of the program and you fill in the last 10% of the blanks. A perfect example of that is a word processor. A word processor can be used to write a business letter, a report for a college exam. It can be used to write a correspondence letter to your friend. Same word processor. We write it once. Millions of people use it.\nAnother program, you know, there’s a lot of database programs. There’s some spreadsheet modeling programs. We do 90% of the work you do the other 10%. Where we’re moving in the future, though, is programming with graphics. Connecting the dots, if you will. And that’s what you’ll be seeing more of over the next five years. What’s really exciting, though, let me give you a little… Some of the finest people are going into software right now.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And, matter of fact, about a year ago, I met this little kid in Chicago who had started this company called Aristotle Software. And he was 13, and he’d started it with his more mature 14-year-old friend. And a year ago, they were making about $4,000 a week off selling three game programs. Now, let me give you an example of how this can work.\nWe have a million Apple IIs out there. A million. And people have paid about $2,000 for them. So if they can buy a new program, one of these new diskettes, for $100, that lets their computer do something totally new that it never could do before, that’s a good deal.\nSo let’s say your girlfriend is in the real estate business. You know a little about computers. And she comes home and she’s filling out all these crazy forms and going through all these calculations and trying to do some creative finance. You go, well, I could write a program for that.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And you write a program that’s not that hard to use. And over the next few months, she goes, well, can it do this? Oh, sure, that’s easy. Can it do this? No, that’s hard. You refine this program to where it’s really great. And all of a sudden, she shows it to all the other people she works with. She brings it into the office or she brings them over one day, and they just go, wow, I’ve got to have this.\nThis is worth $2,000 to me right there just for that one application. Okay. Let’s say that you put that program on the market for $200. Well, the dealer is going to take $50 of it. So you’ll see $50 per copy. And let’s say it costs $25 to make it. You’re going to make $25 profit per copy. If you can sell that to just 10% of the Apple II owners the first year, not including any new Apple II owners because we’re shipping almost a million computers a year, so it’ll double the next year.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "But forget about that. Even the previous owners of a million, you’ll sell 100,000 copies for $25 profit per copy or $2.5 million profit the first year selling to just 10% of the people and you can write that program with under $10,000 worth of computer equipment. That’s what’s happening. That’s why they’re Aristotle Softwares. And so you’re seeing a flurry of activity there right now. Yeah?\nOkay. The actual turnover at Apple has been very, very low since inception. It’s been under 5% since inception actually. Okay, we do it in a few ways.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "First thing we do is what’s happening is the definition of an American corporation is evolving. And it’s evolving in a almost semi-socialistic dimension which is very interesting. 100% of the professionals at Apple own stock in the company. 100%. Everybody owns stock in the company. And what that means is these traditional barriers. I’ve never heard the word labor or management mentioned at Apple ever, ever in my life. We have no unions or anything.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "People say, God, the electronics industry doesn’t have any unions. And that’s true in one way but in the other way we’ve got like one of the best unions of everybody going towards the same exact goals and objectives that I’ve ever seen in my life. It’s on sort of an economic scale for sure because it’s in everybody’s best interest to see the stock go up. But more importantly we feel that for some crazy reason we’re in the right place at the right time to put something back.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And what I mean by that is most of us didn’t make the clothes we’re wearing and we didn’t cook or grow the food that we eat. And we’re speaking a language that was developed using mathematics that was developed by other people. We are constantly taking and the ability to put something back into that pool of human experiences is extremely neat. And I think that everyone knows that in the next 10 years we have the chance to really do that.\nAnd we can look back and while we’re doing it it’s pretty fun too but we can look back and say, God, we were a part of that. And so everyone is working 18 hours a day right now. Now, on the people side. We believe in the phenomenon of great people.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And what I mean by that is we think there are people that are so good that they can run circles around five pretty good people. And those are the kind of people that we want at Apple. They’re hard to… I mean, they’re all idiosyncratic but they’re the fun people of the world. They’re the artists of the world.\nAnd so what we have is sort of a very small company in terms of people for our revenue. We are going to cross a billion in sales very shortly with under 5,000 people worldwide. And that’s phenomenal. And I think our feeling has been that what we want to do is keep the number of people down so that we can spend time with…", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Right. We do a few things. We… Right. That’s exactly right. The first thing we do is we’ve always tried to hire people that were much better than we needed for the current job because within six months they’d be fighting because we’ve always tried to hire people. The reason we hire people is to tell us what to do.\nAnd
