 so at Apple when you get hired some people survive and some don’t. But in general it’s, hey, this is the general thing we think we need done. Go figure out what we need. Come back and tell us and tell us how much it’s going to cost and go do it.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And so we’ve got an incredible group of entrepreneurs. And we’re always arguing with each other and things like that but that’s just fine. And so the 5,000 people we’ve got, most of those people are very independent thinkers and what they really want is they know what to do. What they want is the environment where they don’t have to convince 30 other people that it’s the right thing to do.\nDoes that make any sense? And it’s harder as we get older. It’s harder to spend time with everyone and to pull everyone together but we really make an attempt to do that. And I guess our feeling is that the day that somebody working at Apple decides that they can’t make a difference anymore is the day we’ve lost.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "You know? And we have the standard stuff. I mean, anyone can come see myself or John Sculley or anyone else anytime they want. It might take a day or two to schedule it but we’ve got people at all levels floating around coming to see us.\nThe other thing we’ve observed, of course, is that the oldest and largest organization in the world has only four layers of management and that’s the Catholic Church. And five if you count the highest order, I suppose. And so we see no reason why we need over four layers of management and indeed we have usually about three. And that’s, you know, the president, we maybe have a division manager and then maybe under that a marketing or engineering manager. And that’s really about it. So, that’s what we’re trying to do.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Well, what’s really interesting is that people a lot of times I mean, we have good people and what they’ve been able to do over the last five years is pretty awesome. But what’s even neater is that what we can do in the next five years.\nI mean, we are gonna we’re in a position now where we’re selling a billion dollars of stuff a year. And we’ve got one of the most recognized consumer brand names in the country. And so if we get it together we can turn out these incredibly great products with incredibly great advertising with incredibly great software. And and so what we want to do is just get great people to come help us do that because that’s a pretty giant thing to try to do.\nBut that’s what we’re going for. We started with nothing. So whenever you start with nothing you always can shoot for the moon. You have nothing to lose.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "And the thing that happens is when you when you sort of get something it’s very easy to go into cover your ass mode and then you become conservative and vote for Ronnie. So what we’re trying to do is to realize the very amazing time that we’re in and not go into into that mode. And I think Lease is a reflection of that. We gambled the company on Lease.\nIf Lease had bond Apple would be just one more computer company. And we gambled everything on it. We had no backup to it. Everything went into that.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "For three and a half years the best and the brightest at Apple worked on this product. Now how come they came to Apple to work on this? We hired these people from other companies. And the reason they came to Apple was because they knew what to do. But the companies they were working for wouldn’t take the risk and do it. And we said come to Apple and build this. And they said well we don’t have to convince to do that. Nobody. Just go do it. And we got a collection of I think some of the finest computer scientists in the world that just went and did it. And that’s why I go to work in the morning is to hang around these type of people. They’re fun.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "They play in punk rock bands on the weekends and all sorts of stuff. Computer people aren’t you read all this computer nerd stuff it’s not really true anymore. They’re really a lot closer to artists than they are to anything else. They come into work at about I don’t know anytime they want but usually about 12 in the morning play a few rounds of ping pong work really hard they work really hard but they’ll work and generally about 4 we go out and maybe play you know a game of volleyball somewhere or something like that and then in the evening we work and then they’ll have dinner and we’ll go out to a Japanese restaurant for dinner or something and come back and they’ll work until about 2 or 3 in the morning.\nAnd I go home and wake up at 11 the next morning coming to work. Yeah.\nYeah you. Yeah. Yeah. Uh-huh. Uh-oh. Can you teach skiing?", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Voice recognition is about it’s going to be the better part of the decade away. We can do toy voice recognition now. The problem is it just isn’t it isn’t just recognizing the voice. When you talk to somebody it’s in understanding language is much harder than understanding voice.\nWe can sort of sort out the words but what do they all mean? And most language is exceptionally contextually driven. In other words, one word means something in this context it means something entirely different in another context and when you’re talking to somebody people interact. It’s not a one-way communication.\nIt’s going, yep, yep, yep, yep and they gracefully interact. They go in and out of levels of detail. And boy, this stuff’s hard. So I think you’re really looking at the better part of a decade before we get even close to that.", "title": "International Design Conference, Aspen", "year": "1983", "url": "https://www.youtube.com/watch?v=t9HmOz8H0qI", "sec": "International Design Conference, Aspen (1983)"}, {"t": "Hmm, I’ll give you my point of view on it. I remember reading a magazine article a long time ago when I was twelve years ago maybe, in I think it was Scientific American. I’m not sure. And the article proposed to measure the efficiency of locomotion for lots of species on planet earth to see which species was the most efficient at getting from point A to point B. And they measured the kilocalories that each one expended.\nSo they ranked them all and I remember that the Condor won – the Condor was the most efficient at getting from point A to point B. And humankind, the crown of creation came in with a rather unimpressive showing about a third of the way down the list. So that didn’t look so great.\nBut let me do this over again, because I am just not sure.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "I remember reading an article when I was about twelve years old. I think it might have been Scientific American where they measured the efficiency of locomotion for all these species on planet earth. How many kilocalories did they expend to get from point A to point B? And the Condor 1 came in at the top of the list, surpassed everything else. And humans came in about a third of the way down the list which was not such a great showing for the crown of creation.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And — but somebody there had the imagination to test the efficiency of a human riding a bicycle. A human riding a bicycle blew away the Condor, all the way off the top of the list. And it made a really big impression on me that we humans are tool builders. And that we can fashion tools that amplify these inherent abilities that we have to spectacular magnitudes. And so for me, a computer has always been a bicycle of the mind. Something that takes us far beyond our inherent abilities.\nAnd I think we’re just at the early stages of this tool. Very early stages. And we’ve come only a very short distance. And it’s still in its formation, but already we’ve seen enormous changes. I think that’s nothing compared to what’s coming in the next hundred years.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Let me answer that question a slightly different way. There have been, if you look at why the majority of people have bought these things so far, there have been two real explosions that have propelled the industry forward. The first one really happened in 1977. And it was the spreadsheets. I remember when Dan Fylstra who ran the company that marketed the first spreadsheet, walked into my office at Apple one day and pulled out this disk from his vest pocket and said, “I have this incredible new program. I call it a visual calculator.”\nAnd it became VisiCalc. And that’s what really drove, propelled the Apple to…to the success it achieved more than any other single event. And with the invention of Lotus 123, and I think it was 1982, that’s what really propelled the IBM PC to the level of success that it achieved. So that was the first explosion was the spreadsheet.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "The second really big explosion in our industry has been desktop publishing. Happened in 1985 with the Macintosh and the LaserWriter printer. And at that point people could start to do on their desktops things that only typesetters and printers could do prior to that. And that’s been a very big revolution in publishing. And those are really, those two explosions have been the only two real major revolutions which have caused a lot of people to buy these things and use them.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "The third one is starting to happen now. And the third one is let’s do for human to human communication what spreadsheets did for financial planning and what desktop publishing did for publishing. Let’s revolutionize it using these desktop devices. And we’re already starting to see the signs of that. As an example in an organization, we’re starting to see that as business conditions change faster and faster with each year, we cannot change our management hierarchical organization very fast relative to the changing business conditions. We can’t have somebody working for a new boss every week.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "We also can’t change our geographic organization very fast. As a matter of fact even slower than the management one. We can’t be moving people around the country every week. But we can change an electronic organization like that. And what’s starting to happen is as we start to link these computers together with sophisticated networks and great user interfaces, we’re starting to be able to create clusters of people working on a common task in a.. literally in fifteen minutes worth of setup.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And these fifteen people can work together extremely efficiently no matter where they are geographically. And no matter who they work for hierarchically. And these organizations can live for as long as they’re needed and then vanish. And we’re finding we can reorganize our companies electronically very rapidly. And that’s the only type of organization that can begin to keep pace with the changing business conditions.\nAnd I believe that this collaborative model has existed in higher education for a long time.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "But we’re starting to see it applied into the commercial world as well. And this is going to be the third major revolution that these desktop computers provide is revolutionizing human to human communication in group work. We call it interpersonal computing. In the 1980s, we did personal computing. And now we’re going to extend that as we network these things to interpersonal computing.\nI first saw my first computer when I was twelve. I saw my first computer when I was twelve. And it was at NASA. We had a local NASA center nearby. And it was a terminal, which was connected to a big computer somewhere and I got a timesharing account on it. And I was fascinated by this thing. And I saw my second computer a few years later which was really the first desktop computer ever made. It was made by Hewlett Packard. It was called the 9100-A.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And it ran a language called BASIC. And it was very large. It had a very small cathode ray tube on it for display. And I got a chance to play with one of those maybe in 1968 or ‘69. And spent every spare moment I had trying to write programs for it. I was so fascinated by this. And so I was probably fairly lucky. And then my introduction to computers very rapidly moved from a terminal to within maybe twelve months or so, actually seeing one of the first, probably the first desktop computer ever…ever really produced. And so my point of view never really changed from being able to get my arms around it even though my arms probably didn’t quite fit around that first one.\nI am not the right person to ask.\nAsk, Al.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well, though the analogy is nowhere perfect and certainly one needs to factor out the environmental concerns of the analogy as well. There is a lot to be said for comparing it to going from trains, from passenger trains to automobiles. And the advent of the automobile gave us a personal freedom of transportation. In the same way the advent of the computer gave us the ability to start to use computers without having to convince other people that we needed to use computers.\nAnd the biggest effect of the personal computer revolution has been to allow millions and millions of people to experience computers themselves decades before they ever would have in the old paradigm. And to allow them to participate in the making of choices and controlling their own destiny using these tools.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "But it has created problems. And the largest problems are that now that we have all these very powerful tools, we’re still islands and we’re still not really connecting these people using these powerful tools together. And that’s really been the challenge of the last few years and the next several years is how to connect these things back together so that we can rebuild a fabric of these things rather than just individual points f light if you will. And get the benefit of both, the passenger train and the automobile.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Everything that we’ve done in our — everything I’ve done with computers in my life has been along pretty much a single vector. And NeXT is just one more point on that same vector. Ah in this case what we observed was that the computing power we could give to an individual was an order magnitude more than the PCs we’re giving. In the sense that people want to do many things at once and you really need true multi tasking.\nWe really did want to start to network these things together in very sophisticated networks. So the technology to build that in became available. And most important we saw a way to build a software system that was about ten times as powerful than any PC. And where new software could be created in a fourth of the time.\nSo we spent four years with fifty to hundred of the best software people we could find building this new software system. And it’s turned out beautifully.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "It’s not so much different than everything I’ve ever done in my life with computers starting with the Apple II and the Macintosh, and now NeXT which is if you believe that these are the most incredible tools we’ve ever built which I do, then the more powerful tool we can give to people, the more they can do with it. And in this case we found a way to do two or three things that were real breakthroughs.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Number one was to put a much more powerful computer in front of people for about the same price as a PC. The second was to integrate that networking into the computer so we can begin to make this NeXT revolution within a personal computing. And the PCs so far have not been able to do that very well. And the third thing, and maybe the most important was to create a whole new software architecture from the ground up that lets us build these new types of applications and lets them, lets us build them in 25 percent of the time that it normally takes to do on a PC.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "So we spent four years with 50 to a hundred of the best software people that I know creating a whole new software platform from the ground up. And the way our industry works is that you create this platform software first and then you go out and you get people to write new applications on top of it. Well the height that these new applications can soar is…is enabled or limited by the 8platform software. And there’s only been three systems that have ever been successful in the whole history of desktop computing and that was the Apple IIs platform software of which there wasn’t too much. The IBM PC and Macintosh. So we’re attempting to create the fourth platform software standard and hopefully we’ll succeed because it will allow these applications to be written which far far exceed in capacity what can be done in today’s machines.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "I don’t know. But what I have seen is I’ve seen interpersonal computing happening at our own company. Or maybe the best way to put it is, I remember when the first spreadsheet came out. I saw it fly through Apple as well as other companies. And when we invented desktop publishing of course it influenced Apple first.\nAnd I’ve seen the same thing happen with interpersonal computing here at NeXT. We decided to put a NeXT machine on every employee’s desktop about 18 months ago and connect them with the very high-speed networking that’s built in. And I’ve seen the revolution here with my own eyes. And it’s actually larger than the first two. Let me give you some examples.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "If we want to — if we’re going to be doing a special project let’s say with a company, and we — and let’s say the company is called, what’s your…WGBH. We’re going to be doing a special project with WGBH. And what we’ll do is we’ll create a special mailbox, WGBH and we’ll put twenty people on it that are going to be helping on this project. Now these twenty people will be from all over our company, from marketing, from sales, from engineering, some from manufacturing. Maybe some from our Boston office so they can be close by.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And if one sends a message to this mailbox, they’ll all get it like that, instantly. And if one sends a reply they’ll copy the whole mailbox so the rest of the team members get to read the intellectual content going back and forth. And everyone on this, in this mailbox will probably get around 30 mail messages a day. And they’ll spend about twenty minutes, thirty minutes reading these and answering these per day. And it will be like a beehive.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Now this project is very important for our company and I want to make sure it’s getting off right. So I’ll put my own name on this mailbox and I’ll see these thirty mail messages fly by. All of the disagreements and the arguments and the thoughts and the decisions. And I can just let it fly by and read it. I can do some background coaching with a few people if I think they’re a little off track. I can get right on the network and kibbutz if I’d like. And after a month or so when I know that it’s going well I can take my name off.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And so not only is this a way to organize violating all management and geographic boundaries, it’s also a way to manage where one can see. Again the thoughts, disagreements and decisions of a company fly by a manager in a way that they never could before. And we have seen it reduce the number of meetings we have at least by fifty percent. We’ve seen it get far more managers and individual contributors involved in decisions than there ever were before. We think the quality of the decisions is a lot higher.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And we’ve seen a window for management to look into the process of this organism we call our company in a way that has never before been possible. As we become part of this electronically community that’s going to provide us wonderful new capabilities and communications abilities. But we still always want to be able to disconnect that network spigot, take it off, and take our standalone computer somewhere, let’s say home.\nNow what’s going to happen rapidly as with radio links and with fiber optics to the home, you’re going to be able to hook your computer up to your network at home. But there’s always going to be that cabin in the middle of nowhere that I want to go for a two week vacation where I want my computer. And if it doesn’t work in a completely standalone way, I’m going to be not happy.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "So we have to provide a fluid way for these things to kind of dock into the mother load network, but also undock and allow me as an individual to carry my computer up into Yosemite backpacking. And where there’s no radio links and no fiber optic links and still be able to use it and then come back and dock back into the network and find out what happened when I left and share some of my thoughts maybe with some other folks. So we’re working on that. That’s our goal for the next five years is that seamless transition between a standalone computer and the computer as part of this network community.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "That’s right. I actually think what – an interesting paradox is the network which is ultimately going to define and create the home computer market. Not keeping our recipes on these things or something like we thought in 1975. Being a part of that network and not being able to stay away from it while you’re home will drive people to get computers in every house just like we have a telephone in every house.\nNo I think, I think they’ll be just computers. Just like your phone isn’t your television set. Just like your toaster isn’t your radio. I think they’ll be computers and they’ll have many of the capabilities of these other devices. Multimedia, the ability to integrate sound and video in with the computer is absolutely coming. But a lot of people have mistaken it as the end rather than the means.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "We see multimedia as more of a means. In other words, people aren’t going to buy a computer for multimedia. They’re going to buy it for training. Or they’re going to buy it for interpersonal communication. And in that communication, in addition to a text, they’re going to want voice. They’re going to want, potentially I might want to send you a video clip. But the real market is to help us communicate better, or to help us train somebody. And we need to not lose sight of that.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well Xerox PARC was a research lab set up by Xerox when they were making a lot of profits in copier days. And they were doing some computer science research which was basically an extension of some stuff started by a guy named Doug Engelbart when he was at SRI. Doug had invented the mouse, and invented the Bitmap display. And some Xerox folks that…that Xerox I believe hired away from Doug or split off from Doug somehow and got to Xerox, were continuing along in this vein.\nAnd I first went over there in 1979 and I saw what they were doing with the larger screens, proportionately spaced texts and the mouse. And it was just instantly obvious to anyone that this was the way things should be. And so I remember coming back to Apple thinking our…our future has just changed. This is where we have to go.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "The problem was that Xerox had never made a commercial computer. This group of people at Xerox was…was was more concerned with looking out fifteen years than they were looking out fifteen months trying to make a product that somebody could use. So there were a lot of issues that they hadn’t solved like menus, other things like that. And at Apple what we had to do was to do two things. One was complete the research which really was only about fifty percent complete. And the second was to find a way to implement it at a low enough cost where people would buy it. And that was really our challenge.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well the Macintosh as you remember when it came out, we called it the computer for the rest of us. And what that meant was that while experts could use some of the computers that were already out, most people didn’t 4want — again the computer was not an end in itself. It was a means to an end. And so most people didn’t want to learn how to use the computer. They just wanted to use it. And the Macintosh was supposed to be the computer for people that just wanted to use a computer without having to learn how to use one, spend six months.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Now it turned out that the paradox was that to make a computer easier to use you needed a more powerful computer in the first place because you were going to burn a lot of the cycles on making it easy to use. And so this computer that was easy to use was actually more powerful and could do more things than the less easy to use computer. And it took people a few years to figure that out about the Macintosh. But I think people did.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well I think, I think the Macintosh was created by a group of people who felt that there wasn’t a strict division between sort of science and art. Or in other words, that mathematics is really a liberal art if you look at it from a slightly different point of view. And why can’t we interject typography into computers? Why can’t we have computers talking to us in English language? And looking back, five years later, this seems like a trivial observation. But at the time it was cataclysmic in its consequences. And the battles that were fought to push this point of view out the door were very large.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well again after seeing… my entire life has been spent only in one industry which is this one. And but I’ve been in it now for about fifteen years and I’ve seen a lot of people make a lot of things. I’ve seen a lot of people fail a lot of things. And my point of view on this, or my observation is that the doers are the major thinkers. The people that really create the things that change this industry are both the thinker and doer in one person.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And if we really go back and we examine, you know did Leonardo have a guy off to the side that was thinking five years out in the future what he would paint or the technology he would use to paint it, of course not. Leonardo was the artist but he also mixed all his own paints. He also was a fairly good chemist. He knew about pigments, knew about human anatomy. And combing all of those skills together, the art and the science, the thinking and the doing, was what resulted in the exceptional result. And there is no difference in our industry. The people that have really made the contributions have been the thinkers and the doers.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And when you – a lot of people of course, it’s very easy to take credit for the thinking. The doing is more concrete. But somebody, it’s very easy to say I thought of this three years ago. But usually when you dig a little deeper, you find that the people that really did it were also the people that really worked through the hard intellectual problems as well.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well probably death is the best invention of life. Because it means there’s a constant turnover. And so if you want to make a change in our society, the best place to do it is in the educational system. So that you’re — there are, there are now generations of people that have come out of school who computers are second nature to them. And the people in our society that…that at this point still have, have not embraced these things are getting older, has that cycle, that wheel of birth and death turns, just like driving, people that don’t drive are very rare. Another generation or two, people don’t use computers are, will be pretty rare. It’s a harsh way of saying it but…", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Actually you know, it wasn’t Intel that first figured out that the microprocessor was a computer. They designed these things to be used in calculators. And they thought, the reason that the microprocessor came about was they thought if they could design a slightly programmable one, the next customer that walked in the door that wanted a slightly different calculator they could just spend a few months rather than a few years designing a new piece of silicone. But I think the thought of making a computer never really occurred to them. And it was the hobbyists that thought about making a computer out of these things. It was the computer hobbyists community that first did that.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And I don’t think Intel quite understood that for a few years. But again the first thing that happened was these people came together and formed a club, the home group computer club at Stanford was the first one in the country. And it was a beehive of all of these people who were interested in these small little computers.\nPeople that might have been ham radio operators, people that might have you know worked with large computers were all gathered together to share, discuss their latest little projects. It was very exciting. And there was not a month that would go by where some breakthrough didn’t happen. And then the first magazine came along which was Byte magazine to communicate on a national scale with all these hobbyists. So that it was a very, very exciting dynamic time.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well it didn’t quite work that way actually. What happened was that Woz and I had known each other since I was about 12 or l3 years old. And we built, our first project together was we built these little blue boxes to make free telephone calls. And we had the best blue box in the world. It was this all digital blue box. I don’t think it works anymore.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "But we had, we had a fun time doing that. So when it came to building a computer together Woz focused mostly, Woz was the brilliant hardware engineer and focused on the core design of the computer. And I was worrying about which parts we ought to use and how we were going to build these things and how it sort of, and somebody that wasn’t a Woz was going to manage to buy all the extra parts you still needed to buy and plug this thing together because you still needed to buy your own keyboard, your own display, and your own power supply. And so you needed to be pretty much of a hardware hobbyist.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Now we made the, a very important decision was to not offer our computers a kit. Even though you needed to buy these extra parts. The main computer board itself came fully assembled. We were the first company in the world to do that. Everybody else was offering their little computers a kit. And what that meant was was there was maybe an order of magnitude of more people who could actually buy our computer and use it than if they had to build it themselves.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "And the Apple II was actually the first computer to come fully assembled where you didn’t have to do anything. And the reason there was it was our observation that for every hardware hobbyist, someone who could either build the kit themselves or at least find these five or ten extra parts they needed, there were a thousand potential software hobbyists. And if they didn’t have to do anything with the hardware except use it, make… that meant write their own programs. Still there was a much larger group of people that could take advantage of this. So we wanted to reach them. That was the real breakthrough of the Apple II.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well the Atlantic City computer show was the first… the first face to face gathering of personal computer hobbyists from all around the country was the show put on in Atlantic City in 1976. And it was in the basement of some dingy hotel. And it just happened to be about 300 degrees outside. So the basement, it was like a steambath. And it was impossible to be down there for longer than a half an hour without being completely drenched.\nAnd nevertheless there were a few hundred hobbyists completely drenched walking around for hours. And we had a little tiny booth there. There was a table tablecloth over a hotel table. And there were, Woz and I and a friend or two of our went there and we had our few Apple ls there and a little poster we made. And that was really our first computer show in the world.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "A year later, I think maybe even nine months later, there was the first West coast computer fair which was a much more professional operation by, in comparison with Atlantic City. But still very every hobby oriented compared with what goes on today. And that was in San Francisco and there were maybe a hundred companies showing their wares. And it was attended by maybe a thousand people which was a lot for our industry at that time. l3,000, wow, really. 13,000 people. That’s a lot.\nThat’s a lot. I…I’d be surprised at that. But maybe he knows better than I do. 6,000. Thousands of people. And that’s when we introduced the Apple II. And I think the Apple II is probably the hit of the show at that time.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well we found Regis by — I used to like Intel’s advertising. So I called him up one day and I said who does your advertising? And he said Regis McKenna. And I said what’s Regis McKenna? He said no it’s a person. He gave me his phone number and I called Regis up. He told us to go away about four or five times, but eventually he agreed to help us out.\nAnd then Mike Markkulla I found from a venture capitalist actually, told me that I should go talk to Mike Markkula. Now we hooked up with Mike just around the time we introduced the Apple II. Maybe a month before. But the Apple II was pretty much designed and ready to go. And then Mike came on board and things really started to take off.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Disk drive was crucial. One of the things that people forget when they think about…about Apple and the Apple II in particular was that we were the first company to come out with a reliable, inexpensive floppy disk drive. And we had a low cost floppy disk drive that really worked about two to three years before any of our competitors. And that was an incredibly important reason why the Apple II was successful. A matter of fact, there were a few others.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "The Apple II could hold up to 48 kilobytes of memory which today doesn’t seem like much, but at that time was maybe three times as much as its competitors. And that’s why Visicalc was written for the Apple II. It was the only computer that could hold it. And so if Visicalc had been written for some other computer you’d be interviewing somebody else right now. And it was because of that design decision and other design decisions like it that the Apple II really beat its competition.\nWell the Apple II was the world’s first successful personal computer. And really defined the personal computer as we know it today. So I think it changed the world a lot from that point of view.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well I think in the early days it was very easy because you would go to a home group computer club meeting and there was your whole market and so you could find out what they thought. Now if you show them your product and see what they thought and you could because products were much simpler then and within a few months you could change it all around and come back and show the new one.\nBut as the market got more sophisticated it was less easy to do that. And the problem is that market research can tell you what your customers think of something you show them. Or it can tell you what your customers want as an incremental improvement on what you have but very rarely can your customers predict something that they don’t even quite know they want yet. As an example no market research could have led to the development of the Macintosh or the personal computer in the first place.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "So there are these sort of non-incremental jumps that need to take place where it’s very difficult for market research to really contribute much in the early phases of thinking about how to — you know what those should be. However once you have made that jump possibly before the products on the market or even after is a great time to go check your instincts with the marketplace and verify that you’re on the right track. And usually when you show people something they’ll say oh my God this is fantastic. Or give you some feedback along those lines.\nI’m not the right person to ask. Ask Al.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well, at the time we started Apple, Woz was working for Hewlett-Packard, I was working for Atari, actually for Nolan Bushnell, designing video games. And we went to Atari and showed him our early prototypes and we went to HP. And we encouraged each company to hire it the other one and let us do this for them. And we got turned down in both places, probably for good reasons. But we started the company because it was the only alternative left, not because we wanted to.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Oh it didn’t take very long. It happened for me when I saw people that could never possibly design a computer, could never possibly build a hardware kit. Could never possibly assemble their own keyboards and monitors. Could never even write their own software using these things, then you knew something very big was going to happen. When we got into that stage where we were high enough on the food chain if you will that a lot of people could use these things and they were really liking it.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "One could go on for a long time about how the US has forgotten about manufacturing which has certainly been true but we’re starting to wake up. And what we’re finding is is that time to market is very important and quality is very important and the way we can make tremendous increase in quality and reductions in time to market is through automation. So the automation isn’t there to lower the cost although it does do that, it’s really there to increase the quality and decrease the time it takes us to get our new product, as an example, to market which is very important in a technology based marketplace.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "So we happen to be the lowest cost producer in the world already at NeXT of our class of products. We also happen to be one of the highest quality producers of our type of product in the world. And we think for a company to survive much less prosper in the nineties that these are going to be very very important things to be world class at. We’re not competing at the home group computer society anymore, we’re competing with Europe Inc. and Japan Inc. and IBM Inc. and in order to do that we really have to be world class manufacturers.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well education been on computer networks for longer than almost anyone else. The Department of Defense has an office called DARPA and they funded a thing called ah ARPANET many many years ago to try to build a command and control network for military purposes. And they did a very brilliant thing. After they got a prototype working they gave it to the university community in America and said bang on this for awhile and see if it works and help us make it better.\nAnd after a few years of the university community doing that they created a separate version for military purposes but they left the educational version going. And that is tied together the research community of the United States now for about a decade. And it’s vital to the functioning of higher education in this country.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "So higher education has actually led the way. That’s why we started off focusing exclusively on higher education because where else could you find five thousand people on a network but Carnegie Mellon University as an example. So higher education has been five years ahead of business in using computers in some of these powerful new ways which we’re going to see now ripple into business in the first half of the nineties. It’s pretty exciting.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "So far computer used in K-12 has been primarily Apple IIs. And I wish, I wish that they’d been upgrading the MacIntosh as faster than they have been but I think that’s slowly happening and IBM is getting in there as well. The primary purpose of computing in K-12 has been just computer literacy and there’s been a bottleneck because there hasn’t been enough sophisticated courseware written and that’s a problem for our society in general amongst all the other problems with our K- 12 education system. One could talk about that for a few days easily.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Actually we wanted to get the Mac out a year before we did, so we had internal deadlines that we were not able to meet but by the time we set — by the time we bought the spots for the Super Bowl and things like that it was basically in the bag. It’s not that we didn’t work twenty four hours a day for the last six months to get it out but we were on the bomb run at that time.\nBecause the people that worked on it consider themselves and I certainly consider them artists. These are the people that under different circumstances would be painters and poets but because of that time that we live in this new medium has appeared in which to express oneself to one’s fellow species and that’s a medium of computing. And so a lot of people that would have been artists and scientists have gone into this field to express their feeling and so it seemed like the right thing to do.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Oh wow it was – well I got the first few rows had all the people that worked on the Mac. About a hundred people. A hundred fifty people that really made it happen were all seated in the first few rows and when it was introduced, after we went through it all and had the computer speak to people itself and things like that, the whole auditorium of that twenty five hundred people gave it a standing ovation and the whole first few rows of Mac folks were all just crying.\nAll of us were just …. I was biting my tongue very hard because I had a little bit more to do. But it was a very very emotional moment because it was no longer ours. From that day forward it was no longer ours. We couldn’t change it. If we had a good idea the following day it was too late. It belonged to the world at that point in time.\nI should probably get going.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Well I think maybe it’s something different along the lines of what you want to say….. . You know the semiconductor people didn’t know what they had in the micro-processor for two to three years. It was the computer hobbies that really got the idea to make this into a computer rather than a calculator.\nWhen we started Apple we were out to build computers for our friends. That was all, no idea of a company.\nWell, the whole idea of the Macintosh was a computer for people who want to use a computer rather than learn how to use a computer.\nRight. There is a quote in interview that was done with me in Playboy a while ago. I gave a Macintosh to a young kid one time. It was actually Sean Lennon at his birthday. And he had a great quote, he said, everyone else – and I guess I said this actually —", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "Yeah, right, the older people all want to know how it does what it does but the young people just want to know what it can do.\nThe whole discussion about user interface is just strange to me because to me it’s just sort of a natural thing that had to happen and did happen and it’s happened. It’s kind of like automatic transmissions. Not quite the same as that but…\nWell in the nineties we’re going revolutionize human to human communication using these desktop computers in the same way that spreadsheets revolutionized financial modeling and the desktop publishing revolutionized publishing.\nOkay, good.\nNo, I got to go.", "title": "Interview (1990)", "year": "1990", "url": "https://www.youtube.com/watch?v=NwccnuHz5fM", "sec": "Interview (1990)"}, {"t": "This is the day I've been looking forward to for two and a half years.\nEvery once in a while, a revolutionary product comes along that changes everything and Apple has been – well, first of all, one's very fortunate if you get to work on just one of these in your career. Apple has been very fortunate. It's been able to introduce a few of these into the world.\n1984 – we introduced the Macintosh. It didn't just change Apple. It changed the whole computer industry.\nIn 2001, we introduced the first iPod. And it didn't just change the way we all listen to music, it changed the entire music industry.\nWell, today we're introducing three revolutionary products of this class. The first one is a widescreen iPod with touch controls. The second is a revolutionary mobile phone. And the third is a breakthrough Internet communications device.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, three things: a widescreen iPod with touch controls; a revolutionary mobile phone; and a breakthrough Internet communications device. An iPod, a phone, and an Internet communicator. An iPod, a phone… are you getting it? These are not three separate devices, this is one device, and we are calling it iPhone. Today, Apple is going to reinvent the phone, and here it is.\nNo, actually here it is, but we're going to leave it there for now.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, before we get into it, let me talk about a category of things. The most advanced phones are called smart phones, so they say. And they typically combine a phone plus some e-mail capability, plus they say it's the Internet. It's sort of the baby Internet into one device, and they all have these little plastic keyboards on them. And the problem is that they're not so smart and they're not so easy to use, and so if you kind of make a Business School 101 graph of the smart axis and the easy-to-use axis, phones, regular cell phones are right there, they're not so smart, and they're not so easy to use.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "But smartphones are definitely a little smarter, but they actually are harder to use. They're really complicated. Just for the basic stuff people have a hard time figuring out how to use them. Well, we don't want to do either one of these things. What we want to do is make a leapfrog product that is way smarter than any mobile device has ever been and super-easy to use. This is what iPhone is.\nSo, we're going to reinvent the phone. Now, we're going to start with a revolutionary user interface. It is the result of years of research and development, and of course, it's an interplay of hardware and software.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, why do we need a revolutionary user interface. Here's four smartphones, right? Motorola Q, the BlackBerry, Palm Treo, Nokia E62 — the usual suspects. And, what's wrong with their user interfaces? Well, the problem with them is really sort of in the bottom 40 there. It's this stuff right there. They all have these keyboards that are there whether or not you need them to be there. And they all have these control buttons that are fixed in plastic and are the same for every application. Well, every application wants a slightly different user interface, a slightly optimized set of buttons, just for it.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And what happens if you think of a great idea six months from now? You can't run around and add a button to these things. They're already shipped. So what do you do? It doesn't work because the buttons and the controls can't change. They can't change for each application, and they can't change down the road if you think of another great idea you want to add to this product.\nWell, how do you solve this? Hmm. It turns out, we have solved it. We solved in computers 20 years ago. We solved it with a bit-mapped screen that could display anything we want. Put any user interface up. And a pointing device. We solved it with the mouse. We solved this problem. So how are we going to take this to a mobile device? What we're going to do is get rid of all these buttons and just make a giant screen. A giant screen.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, how are we going to communicate this? We don't want to carry around a mouse, right? So what are we going to do? Oh, a stylus, right? We're going to use a stylus. No. Who wants a stylus? You have to get them and put them away, and you lose them. Yuck. Nobody wants a stylus. So let's not use a stylus.\nWe're going to use the best pointing device in the world. We're going to use a pointing device that we're all born with — born with ten of them. We're going to use our fingers. We're going to touch this with our fingers. And we have invented a new technology called multi-touch, which is phenomenal. It works like magic. You don't need a stylus. It's far more accurate than any touch display that's ever been shipped. It ignores unintended touches, it's super-smart. You can do multi-finger gestures on it. And boy, have we patented it.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So we have been very lucky to have brought a few revolutionary user interfaces to the market in our time. First was the mouse. The second was the click wheel. And now, we're going to bring multi-touch to the market. And each of these revolutionary interfaces has made possible a revolutionary product — the Mac, the iPod and now the iPhone. So, a revolutionary user interface. We're going to build on top of that with software.\nNow, software on mobile phones is like baby software. It's not so powerful, and today we're going to show you a software breakthrough.\nSoftware that's at least five years ahead of what's on any other phone. Now how do we do this? Well, we start with a strong foundation. iPhone runs OSX.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, why would we want to run such a sophisticated operating system on a mobile device? Well, because it's got everything we need. It's got multi-tasking. It's got the best networking. It already knows how to power manage. We've been doing this on mobile computers for years. It's got awesome security. And the right apps. It's got everything from Cocoa and the graphics and it's got core animation built in and it's got the audio and video that OSX is famous for. It's got all the stuff we want. And it's built right in to iPhone. And that has let us create desktop class applications and networking. Not the crippled stuff that you find on most phones. This is real, desktop-class applications.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, you know, one of the pioneers of our industry, Alan Kay, has had a lot of great quotes throughout the years, and I ran across one of them recently that explains how we look at this, explains why we go about doing things the way we do, because we love software.\nAnd here's the quote: \"People who are really serious about software should make their own hardware.\" Alan said that 30 years ago, and this is how we feel about it. And so we're bringing breakthrough software to a mobile device for the first time. It's five years ahead of anything on any other phone.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "The second thing we're doing is we're learning from the iPod, synching with iTunes. You know, we're going to ship our 100 millionth iPod this year, and that's tens of millions of people that know how to synch these devices with their PCs or Mac and synch all of their media right on to their iPod. Right? So you just drop your iPod in, and it automatically synchs. You're going to do the same thing with iPhone. It automatically syncs to your PC or Mac right through iTunes. And iTunes is going to synch all of your media onto your iPhone. Your music, your audio books, podcasts, movies, TV shows, music videos. But it also synchs a ton of data. Your Contacts, your Calendars and your Photos, which you can get on your iPod today, your Notes, your Bookmarks from your Web browser, your e-mail accounts, your whole e-mail set-up.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "All that stuff can be moved over to your iPhone completely automatically. It's really nice. And we do it through iTunes.\nAgain, you go to iTunes and you set it up. Just like you'd set up an iPod or an Apple TV. And you set up what you want synched to your iPhone. And it's just like an iPod. Charge and synch. So synch with iTunes.\nThird thing I want to talk about a little is design. We've designed something wonderful for your hand, just wonderful. This is what it looks like. It's got a three-and-a-half-inch screen on it. It's really big. And, it's the highest-resolution screen we've ever shipped. It's 160 pixels per inch. Highest we've ever shipped. It's gorgeous. And on the front, there's only one button down there. We call it the Home button. Takes you Home from wherever you are. And that's it.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Let's take a look at the side. It's really thin. It's thinner than any smartphone out there, at 11.6 millimeters. Thinner than the Q, thinner than the BlackJack, thinner than all of them. It's really nice.\nAnd we've got some controls on the side, we've got a little switch for ring and silent, we've got a volume up and down control.\nLet's look at the back. On the back, biggest thing of note is we've got a two-megapixel camera built right in. The other side, we're back in the front. So let's take a look at the top now. We've got a headset jack. 3.5 millimeter all your iPod headphones fit right in. We've got a place, a little tray for your SIM card, and we've got one switch for sleep and wake. Push it to go to sleep, push it to wake up.\nLet's take a look at the bottom. We've got a speaker, we've got a microphone, and we've got our 30-pin iPod connector. So that's the bottom.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, we've also got some stuff you can't see. We've got three really advanced sensors built into this phone. The first one is a proximity sensor. It senses when physical objects get close, so when you bring iPhone up to your ear, to take a phone call, it turns off the display, and it turns off the touch sensor, instantly. Well, why do you want to do that? Well, one to save battery, but two, so you don't get spurious inputs from your face into the touch screen. Just automatically turns them off, take it away, boom, it's back on. So it's got a proximity sensor built in. It's got an ambient light sensor built in, as well. We sense the ambient lighting conditions and adjust the brightness of the display to match the ambient lighting conditions. Again, better user experience, saves power.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And the third thing that we've got is an accelerometer, so that we can tell when you switch from portrait to landscape. It's pretty cool. Show it to you in a minute. So three advanced sensors built in.\nSo, let's go ahead and turn it on. This is the size of it. It fits beautifully in the palm of your hand. So, an iPod, a phone, and an internet communicator.\nLet's start with the iPod. You can touch your music. You can just touch your music, it's so cool. You've got a widescreen video. You can find your music even faster. Gorgeous album art on this display. Built-in speaker, and, why not? Cover flow. First time ever on an iPod. So rather than talk about this some more, let me show it to you.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Alrighty. Now, I've got some special iPhones up here, they've got a little special board in them so I can get some digital video out, and I've got a little cord here which goes up to these projectors, so I've got some great images, and you get to see what it really looks like.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, let me — I've got a camera here so you can see what I'm doing with my finger for a few seconds. And let me go ahead and get that picture within picture up. I'm going to go ahead and just push the sleep/wake button and there we go, right there. And to unlock the phone I just take my finger and slide it across. Want to see that again? We wanted something that you couldn't do by accident in your pocket. Just slide it across. Boom. And this is the home screen of iPhone right here. And so if I want to get in the iPod, I just go down to that lower right hand corner and push this icon right here, and boom, I'm in the iPod. I want to get home, I push the home button right here, and I'm home. Back in the iPod.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, here I am you see five playlists across the bottom. Playlists, songs, videos and more. I'm in artists right now. Well, how do I scroll through my lists of artists? How do I do this? I just take my finger, and I scroll. Isn't that cool? A little rubber banding up when I run off the edge.\nAnd if I want to pick somebody, let's say I want to pick the Beatles, I just tap them, and here's the Beatles songs with their albums right here. If I want to play Sgt. Pepper's I just hit Sgt. Pepper's right there, and \"A Little Help From My Friends.\"", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Look at this gorgeous album artwork here. Of course, I've got a volume control. Now, I've got a little button up in the corner right here, you can see in the upper right-hand corner, I can hit that and flip the album art around. There's all the other songs back here. And I can play \"Lovely Rita\" if I want to. Flip back around. Very simple. Right, I can set some stars back here just by setting the arrows. That's a five star album. Isn't that cool? Yeah, it's pretty nice.\nNow, let me show you something else. I just take my unit here, and I turn it landscape mode, oh, look what happens! I'm in cover flow.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Let's go into Dylan here, let's play \"Like a Rolling Stone.\" I just thumb through, just thumb through my albums. It's real easy. Anytime I find something I like, I just turn it around, and play something. It's that easy. It's that simple. Isn't that great? Alright. I could play with this for a long time.\nAgain, I've got playlists here. I can go into my playlists. I've got artists. I've got songs. I've got more over here. I've got albums. I've got a great album view again that shows all my album artwork if I want. And I've also got audio books and compilations and things like that. I've also got videos here. So I push videos and I've got a video podcast loaded on, and a music video. And I've got a TV show and a movie, and I'd just like to show you the TV show here. This is an episode from The Office. All videos we look at in landscape.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "We have touch controls on here, of course. Isn't that awesome? Isn't that awesome?\nNow I want to show you a movie playing. Let's play Pirates of the Caribbean, the second one. Great movie, by the way.\nNow this is a widescreen movie so I just double-tap and I can see the whole thing here, or I can fill up the screen, whichever I like. And again, I've got on-screen controls here. Isn't this cool? So we can be watching feature-length movies just like this.\nAlrighty. So that is the iPod. Pretty cool, huh? We've just started.\nSo again, touch your music, scroll through your songs, scroll through your playlists. It's incredible. Widescreen video like you've never seen on a portable device, 160 pixels per inch, gorgeous screen quality, gorgeous album art, and cover flow. It's the best iPod we've ever made.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Again, some screen shots. It's unbelievable. Here's some album art I just put up, so you can see what it looks like. Just, no matter what you like, it looks pretty doggone gorgeous. And of course, cover flow and video, with on-screen controls.\nYou know, I was showing this to somebody — I was giving a demo to somebody a while ago, who had never seen this before, inside Apple. And I finished the demo, and I said what do you think. They told me this, they said, You had me at scrolling. So, the iPhone with the most amazing iPod ever. You can now touch your music. So that's the iPod.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, let's take a look at a revolutionary phone. We want to reinvent the phone. Now, what's the killer app? The killer app is making calls! It's amazing — it's amazing how hard it is to make calls on most phones. Most people actually dial them every time. Most people don't have very many numbers in their address book they use their recents as their address book. Right? How many of you do that? I bet more than a few. So, we want to let you use contacts like never before. You can synch your iPhone with your PC or Mac and bring down all your contacts right into your phone. So you've got everybody's numbers with you at all times.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "We have something that's going to revolutionize voice mail. We call it visual voice mail. Wouldn't it be great if you had six voice mails if you didn't have to listen to five of them first before you wanted to listen to the sixth? Wouldn't that be great if you had random access voice mail? Well, we've got it. Just like e-mail you can go directly to the voice mails that interest you. Excellent audio quality. iPhone is a quad-band, GSM plus EDGE phone. We have decided to go with the most popular international standard, which is GSM. We're on that bandwagon, headed on that roadmap, and plan to make 3G phones and all sorts of amazing things in the future. So, quad-band GSM plus EDGE, and of course we have wi-fi and Bluetooth 2.0 EDR built in, as well.\nSo this is what it looks like when you get a call. This is what it sounds like. It's one of our ring tones, you can pick of course.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, I want to show you four things. I want to show you the phone app, photos, a calendar, and SMS messaging. The kind of things you would find on a typical phone, but in a very untypical way. So let's go ahead and take a look.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So let's go to our phone first. You see that icon in the lower left-hand corner, the phone? I just push it right here, and boom, I'm in the phone. And I've got five buttons across the bottom: favorites, recents, contacts, keypad and voice mail. I'm in contacts, right now, again. How do I move around my contacts? I just scroll through them. And so, let's say I want to make a call to Jony Ive. I can just push here, and I see Jony Ive's context, with all his information: his three phone numbers, his e-mail, whatever else, his address, whatever else I've got. It's all in one place. And if I want to call Jony, all I do is push his phone number. I'll call his mobile number right now. And now, we are calling Jony here.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Hey, Jony, how you doing? Well, it's been 2.5 years, and I can't tell you how thrilled I am to make the first public phone call with iPhone. I remember when we first started working on this, and it's just unbelievable. Woah, what is this? I've got another call coming in. Jony, can I put you on hold for a minute? So I put Jony on hold and …\nSorry Phil! As you can see, it's put Jony on hold, and Phil, I can just touch Jony and bring Jony back. Hey, Jony are you there? Hey listen, Phil called. Do you mind if I conference him in?", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "You can see the button has changed to merge calls right there in the middle, so I just push that right here, and now, I've created a conference call. Jony, you there? Phil, you there? So here we are, and listen I got to get back to my keynote, so if I want to do that, I just touch this arrow right here, and I'm going to go ahead and take Jony private here and put Phil on hold. Jony, do you have anything to say on the first phone call?\nIt's not too shabby. You take care, Jony. And I end this call. Phil's on hold. I take him off of hold. Phil, thanks very much, I've got to get back to the keynote now. Alrighty.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, now I've also got a way to make a list of favorites here, from my most-often called numbers so I can just touch it once and dial the number. And I might want to add somebody to favorites, so let's say I want to add Phil Schiller, I just push that plus button in the upper right-hand corner right there, and up pop my favorites, and I can just go to S is here and there's Phil, so Phil Schiller is right there. And I'll put, let's say I want to put Phil's work number, and it's added Phil, right there you see favorites. I can edit favorites by pushing the edit button in the left-hand corner, and I can move Phil up if I want to, maybe to the top.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And let's see, Tony's changed his number I've got to update this anyway, so I'm going to get rid of that and I can just remove Tony. Boom, there we go. It's that simple to edit these things. Very, very easy. I've got recents right here, which is all my recent phone calls. If I want to see the ones I've missed, which are in red, I can just go up and touch that button at the top, and boom, those are all the ones I've missed, and those are all the calls that I've placed or have gotten. If I want to dial the phone, if I'm real last-century, I can push keypad here, and I can dial a call just with … oops, called four, sorry. Wrong number. 408-996-1010. And it formats the numbers and if I want to, I can just keep dialing, let's say it's a European number, and the numbers just keep getting smaller, real simple. Very simple to dial with the keypad.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now let me show you visual voice mail. This is so cool. This is a collaboration that we've done, which I'll talk more about later, and it allows us to have random access voice mail. Go directly to the voice mails we want. So as an example, I come to my voice mail, and I say, oh, there's one by Al Gore. I want to hear that one. I just push it.\nNow, if I want to call Al back right now, I can just push that call back button. But I want to listen to one from Tim Cook that I've got here, so let me listen to Tim.\nIsn't this awesome. And so I've got voice mail how I want to listen to it, when I want to listen to it, in any order I want to listen to it with visual voice mail. So that is a quick tour of the phone app.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now what I want to do is show you SMS texting. So I just go to that SMS icon in the upper-left-hand corner and push it. And I not only have SMS texting, but I have multiple sessions. So I can be carrying on conversations with people, and every time I get messages from them, I can be alerted to that, and go check it out. As an example here, I've got Eddie Q and I've been carrying on a conversation with Eddie, and I just tap this, and here's the conversation I've been carrying on right here. And if there's a new message it will tell me. And so there's a new message from Phil, and let's see the conversation was what.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And I've got this little keyboard which was phenomenal. It does error prevention and correction. Not that I won't make some, I probably will. But it's actually really fast to type on. It's faster than all these little plastic keyboards on all these smart phones. So I can just say sounds great, see you there. And I can send that. And there it is. It's that simple. And when Phil messages me back, I'll be alerted, I'll see the dot, and I can just go pick up that conversation where it left off. If I want to send a message to Eddie or Scott, I just push this and send a message and go. It's so simple. So that's SMS messaging, and again, you've seen the keyboard, it's pretty awesome. We'll come back to that a little bit later.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And the third app I want to show you as part of the phone package is Photos. You know, we have a two-megapixel camera built in, as I said. We also have the coolest photo management app ever, certainly on a mobile device, but I think maybe ever. And so here's our photos. I'm going to go into our photo library, and
