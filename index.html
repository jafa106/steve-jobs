 this is our library and again, I can just scroll through photos here with my finger. Pretty cool. Let me go to photo album, I'll pick Italy, and I just, let's start at the top. And to go through pictures, I just swipe them. I can just swipe through my photo library. There's one that's landscape. I can just turn my device and take a look at it. Pretty cool, huh?", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So I can even swipe when I'm in landscape here. Isn't this awesome? The other thing I can do is I can take any of these pictures and I can make them bigger. So let me go ahead and get the camera back up. I can take my fingers and I can, we call it the pinch, I can bring them closer together and move them further apart to make it bigger or smaller. So I can just move them further apart and stretch the image. Isn't that cool? I can move it around, and…isn't that cool? And now what I can do is I can pick to make this my wallpaper. And of course, I could jigger it around then and just set the wallpaper, and now if I'm back at home and I go to sleep, when I wake up from here on out, until I reset it, that's my wallpaper. Whenever I'm making a call, that's what I'm going to see. Boom. There we go. So photos, SMS and the phone app. That is part of our phone package for iPhone.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Get a call, again, just really great call management features, just scroll through contacts with your finger. All the information at your fingertips here. Favorites, last century, visual voice mail. Calendar, SMS texting, incredible photo app, the ability to just take any picture and make it your wallpaper. It's pretty unbelievable, and I think when you have a chance to get your hand on it, you'll agree, we have reinvented the phone.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, now, let's take a look at an Internet communications device as part of iPhone. So what's this all about? Well, we've got some real breakthroughs here. To start off with, we've got rich, HTML e-mail on iPhone. The first time really rich e-mail on a mobile device. And it works with any IMAP or POP e-mail service. You got your favorite mail service, it'll likely work with it. And it's rich text e-mail. We wanted the best web browser in the world on our phone, not a baby web browser or a WAP browser, a real Web browser, and we picked the best one in the world, Safari, and we have Safari running on iPhone. It is the first fully usable HTML browser on a phone.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Third, we have Google Maps. Maps, satellite images, directions and traffic. This is unbelievable, wait until you see it. We have widgets, starting off with weather and stocks. And this communicates with the Internet over EDGE and Wi-fi. And iPhone automatically detects Wi-fi and switches seamlessly to it. You don't have to manage the network. It just does the right thing.\nNow, I want to take a second and talk about e-mail. We hook up to almost any IMAP or POP3 mail service. I just want to give you some examples. IMAP of course is the best because you can keep folders and all your e-mail on the server and access it from anywhere. Yahoo Mail is IMAP. Microsoft Exchange has an IMAP option. And obviously. Mac mail is IMAP, as well. POP3, Google Gmail, AOL Mail, and most ISPs are POP3 e-mail.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, I want to take a minute and highlight one. Yahoo! Mail. Yahoo! Mail is the biggest mail service in the world. They have over a quarter billion users. Biggest e-mail service in the world, and today, we are announcing with Yahoo! that they are going to provide free push IMAP e-mail to all iPhone customers. So, this isn't just IMAP e-mail. It is push IMAP e-mail. So when you get a message, it will push it right out to the phone for you. Same as a BlackBerry. Free IMAP push e-mail from Yahoo!. So we think this is a pretty big deal. So what I'd like to do now is I'd like to show you mail, Safari, Google Maps and widgets running on iPhone. So let's go see.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So let's go into mail. Second icon from the left on the bottom there. I just touch it with my finger, and boom, I'm there. And so I've got an in-box here, and this is, by the way, running live on Yahoo! IMAP e-mail. This stuff is coming off a Yahoo! server somewhere up in the cloud. And so I can say James Vincent here sent me an e-mail. He's a proud father, and there we go. And I can just scroll here. I've got in-line photos, rich text e-mail. There we go.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So let's look at another one. Phil Schiller. She loved the gift. Again, in-line photos, rich text, pretty nice. Shopping list, again, rich text right here. Pretty cool. Directions to Sushi Ron for tonight's dinner. Now, iPhone of course parses out phone numbers and you can see there's a phone number in blue. I can just touch it, and boom, I'm going to call this place. I don't really want to call them so I'm going to end the call here. But you get the idea.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And this last one, Ken Bereskin is one of our marketing folks. He just returned from Antarctica. Ken's a great photographer, and he took all these great photos of penguins in Antarctica. Look at this, it's great. Right in your e-mail, right on your phone. And if I want to by the way, I can look at my e-mail with a split view just like I do on my computer, and so I can select something here and just look at it down here if I want to push my messages real fast and just find that one message I was looking for. But I actually like the full-screen view. And of course, we have a standard in-box and drafts, and all sorts of folders you can put things in as well. So it's real e-mail, just like you're used to on your computer, right here on your phone. It's extraordinary. And again, free IMAP e-mail from Yahoo!.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, let me go ahead and create an e-mail message. Show you what that's like. So again, when I don't need a keyboard it's not there. When I do, it's there. I want to send a message to, let's say, Phil. I just type Ph, and boom, Phil Schiller, it's address completion and maybe I'll send one to Scott Forrestal, as well, and there's Scott right there, and let's say the subject is dinner. Boom, and I just hit send. It sends that e-mail, and we're done. So that is mail. Full desktop class e-mail running on a mobile device.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "All right, now I want to show you something incredible. I want to show you Safari running on a mobile device. So let's go to the Web, and here we are. I'm going to load in, rather than apple.com here, a more universal site. I'm going to load in the New York Times, it's kind of a slow site because it's got a lot of images, but here we're loading and we're loading over wi-fi right now. And rather than just give you a WAP version of the New York Times, rather than giving you this wrapped version all around, we're showing you the whole New York Times Web site, and there it is. Guess what I can do, I can just put this into landscape mode, and there it is right there. And I can scroll here if I want. Scroll up and down here. Still loading it in. There we go. Or I can just get back like this.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, this is really great and I can see the whole page but of course I can't read it. It's a little too small. So I can get in with my fingers and pinch it but we have an optimization here. I can just double-tap on anything and it automatically fills up the screen with it. And I can just scroll around like this and scroll over here and I can even make this text bigger if I want to, and there it is. Just double-tap again to get back to the whole page. Isn't this cool? Look at this. There is the New York Times. And again, any article I want, boom, there we go. Boom. Unbelievable.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, you can look at multiple Web pages as well. You can have multiple Web pages open. So I just push this button in the lower-right hand corner. Shrinks it down, and I can add a new page if I want. And I'll go to Amazon here out of my bookmarks. So let's go to Amazon. And I love to go the DVD section of Amazon and see what DVDs are selling. I like it especially when Disney's are in the top. And, so here's Amazon, and even before the whole page is loaded on, I'm just going to double-tap on this, and I'm going to say let's go to the DVD section here, and now it's doing that. And here we are.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And there's a section over here in the right hand side right there, and these are the top sellers, updated hourly. Oh look, Al's Inconvenient Truth is number one. Alright. And here's the other movies. Gray's Anatomy, I like that. Pirates of the Caribbean. Fantastic. And so I've got this right here, and I can go back to the New York Times if I want. Zoom up to that picture so we can all see it. And again, isn't this cool? Just go over there and get back to this one. I can get rid of it just by hitting the X. And there we go. Isn't that incredible? Safari.\nYou know, if you've ever used what's called a Web browser on a mobile phone, you'll know how incredible this is. I hope you'll never really know, because it's bad out there today, and this is a revolution of the first order, to really bring the real Internet to your phone.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Let me show you something about widgets here. Let's go to stocks right now, and we're going to load stock information off the Web, and just right onto the phone here. Oh, look, Apple's up! That's great! Well, I could look at different graphs here if I want to. And that's fantastic. Let's look at the percentages here. Oh, good. Good good. So I've got stocks right here, and I can go look at the weather. Let's see what it's like outside. 49 degrees, but it's supposed to get to 61 today, so that's good. We'll just stay in here until it warms up. Now, I've got Paris right here. I can have as many of these as I want, so it's nighttime in Paris. It's actually warmer in Paris at night than it is here today. Wow. Aspen, well, no snow until later in the week. And Hawaii. Oh, it's raining, that's not good. Well, anyway, here's four places.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Hawaii, Aspen, Paris and San Francisco, and again, the weather widget.\nNow, to conclude with the Internet device section here, I want to show you something truly remarkable, which is, Google Maps on iPhone. I hit our maps application here and it's coming up. And it shows us North America, and I'm going to go to Moscone West. That's where we are right now. And here we are. Boom. That's where we are.\nNow, what I'm going to do, is I'm going to go look for something. I'm going to certainly want a cup of coffee afterwards, so I'm just going to look for Starbucks, right? Starbucks, so I'm going to search for Starbucks, and sure enough, there's all the Starbucks. Now, I can get a list of Starbucks here, and I can pick that one if I want, and I can even go look at that Starbucks, and there it is, and let's give them a call.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Yes, I'd like to order 4,000 lattes to go, please. No, just kidding, wrong number. Thank you. Bye-bye.\nNow, I can zoom in by just pinching if I want to. Or I can just double click to zoom in, and I get just higher and higher resolution versions of the map. So let's go somewhere else here that I've got bookmarked. Let's go to the Washington Monument. And so here's Washington, D.C, and I could just double-tap and I'm going in a little further here, just double-tapping in. And there's the Washington Monument there, and I'll double-tap in again. But now I want to show you something else.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Satellite images. So I just hit this button called satellite at the bottom. It's going to replace the map with satellite images, there we go. And I can just double-tap in, and double-tap in again. And let's double-tap in again. This is the Washington Monument. Look at this. I can see people down there. Whoops, there we go. Yep. Isn't that incredible. Right on my phone! It's unbelievable. So let's go, I've got another one, the Eiffel Tower, which is very cool. I set this one to be, look at this, there's the Eiffel tower. There's people at the Eiffel Tower you can see. Look at that. Incredible. And here, one last one I have to show you, the Colosseum in Rome. So again, here we are in Rome. That's as far as we can go with the map, but we can go a little further with the satellite. There's the Colosseum. There's the Roman Colosseum. Satellite imagery, right on the phone. Look at that.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "That's the Colosseum. Unbelievable. Right on the phone. What do you think. Isn't that incredible?\nSo, all these amazing things. This is a breakthrough Internet communicator built right into iPhone. The first rich HTML e-mail on a phone. The first real Web browser on a phone. Best version of Google Maps on the planet, widgets, and all with EDGE and Wi-fi networking. We're very, very happy with this. Again, push e-mail. IMAP free Yahoo! and almost any other IMAP and POP service you want to hook up to. Incredible new technology for entering text. Far better than we've seen on phones before. A real browser on the phone. We can see real Web pages in portrait or landscape. We can zoom in on what we want to take a look at more closely. Google Maps and widgets. It's the Internet in your pocket for the first time ever.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, you can't really think about the Internet, of course, without thinking about Google, right? And for Google, what we have on our phone, working with them is of course Google search, we have that built right into the browser. Just type what you want, hit Google and you're off. And Google Maps. We've been working very closely with them to make this all happen. We're thrilled with the results, and it's my pleasure now to introduce Dr. Eric Schmidt, Google's CEO.\nThank you, Eric. As a board member, you will get one of the first ones.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Okay. Now, you also can't think about the Internet without thinking about Yahoo!. And again on the phone, we've got Yahoo! Search built right in, you can select which one you want to use. Just type in something, hit that Yahoo! button and boom, you're off. And of course, we also have Yahoo! IMAP e-mail services. And so, it is my great pleasure to introduce Jerry Yang, co-founder and chief Yahoo.\nYou know, it's been great having the two greatest companies on the Web right down the block. Google and Yahoo! And we've been able to work with these guys really closely, and it's been an incredible pleasure to work on this great technology and bring it to everybody in iPhone. So thank you guys very much. You've really helped us put the Internet in your pocket.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, Internet communicator, an iPod and a phone. Let's put them all together and see what you can do in a real-life scenario. So, let's take a look. I want to listen to some music, so I want to go into my iPod here and let's see, in artists, I want to listen to, oh, maybe Red Hot Chili Peppers, I love those guys. And so I'm listening to a song of theirs. And let's see what happens when I get a phone call. Music fades out. Screen changes. Got a phone call coming in. So I can ignore it, but I think I'm going to answer it. So I'll answer it. Howdy. Hi Phil, listen I'm kind of busy right now. What can I do for you?", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Oh, Okay, hold on just a sec. So I push the home button on my wallpaper and I go home right here, and I'm still on the call. You can see the phone thing flashing right there on the lower left. And I go into photos and now I'm in photos and you can see the bar across the top, the green bar, I can just touch that to return to the call. And Phil wants a photo that he wanted to use it for his screensaver, it was one of the ones that was taken in Hawaii, I think it was this one. Yep, there it is.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So you want me to mail this to you, Phil? So I again I just go down here and push this button, and rather than use it as wallpaper, I'm going to e-mail it. So watch what happens now. It shrinks it a little bit, and then a compose windows will come up right behind it. There we go. And I will just tap in the to field and send this to Phil here, Phil Schiller there we go. And the e-mail is there, yep, it's there, and I'm just going to send it. Hey, Phil, that should be on its way right now.\nAnything else?…Let me go check it out. I think I've got Fandango in my bookmarks here. Yes, I do. Let's go to Fandango, figure out what movies are playing. … To go back to my call I just touch the top here, and I'm back at my call, and I'm just going to go ahead and end the call. What happens now? Back in my music. So, this is what it's like when you put it all together.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now how does this stack up. Let's go back to these guys. Let's take a look. Well, these are their home screens. And again, as you recall, this is iPhone. This is what their contacts look like. This is what iPhone's contacts look like, and again, you just pick one and you see everything about that person, all the information you have. This is what mail looks like on these smartphones. Again this is what mail looks like on iPhone. You have rich, HTML, rich text e-mail. This is what calendars look like on these guys. This is what calendars look like on iPhone. This is what the Web looks like, and we tried to make it look as good as we could on these. It usually looks worse and this is what you get, and of course, this is what you get on iPhone, and you can zoom in and see anything you want.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And this is what you get for music players, nobody really uses them much, and this is what you get on iPhone.\nSo after today, I don't think anyone is going to look at these phones quite the same way again.\nNow let me tell you about some accessories we've got for iPhone. Got some great stereo headphones we're going to be shipping, and they've got a little addition to them, which is this little thing right over here. It's a microphone and a switch, so you can talk, you have them in there, you can get a call and just talk. Beautiful reception on the microphone. And just push it together to answer a call or hang up on a call. So you can be wearing them. It just dangles right there and picks up your voice beautifully.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And we also have a Bluetooth accessory headset that we're going to be shipping and there it is right there. It's incredibly small and just to let you see what it looks like, it's got one button on the top for answering and hanging up a phone call. You never have to turn it off or on. It just goes to sleep. It automatically pairs with iPhone so you don't have to worry about pairing. It's really simple. And it's very tiny. This is what it looks like in-ear. It's just beautiful. It's the coolest one that we've ever seen. So Bluetooth headset coming as well.\nBattery life. A lot of these smartphones have pretty low battery lives. We've managed to get five hours of battery, and that's for talk time, video or browsing. Five hours of battery life, and 16 hours of audio playback, so that's dramatically better than any of these smartphones.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "There is a tremendous amount of high technology in iPhone. We've been pushing the state of the art in every facet of this design. So let me just talk a little bit about it here. We've got the multi-touch screen. A first. Miniaturization, more than any we've done before. A lot of custom silicon. Tremendous power management. OSX inside a mobile device. Featherweight precision enclosures. Three advanced sensors. Desktop class applications, and of course, the widescreen video iPod. We've been innovating like crazy for the last few years on this, and we filed for over 200 patents for all the inventions in iPhone, and we intend to protect them. So, a lot of high technology. I think we're advancing the state of the art in every aspect of this design. So iPhone is like having your life in your pocket. It's the ultimate digital device.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So what should we price it at? Well, what do these things normally cost? An iPod, the most popular iPod, $199 for 4 gig nano. What's a smartphone cost? Well, they say you get the phone and some of the Internet with it, although that's questionable. But they cost somewhere around $299. You can get them for $199. Palm just introduced one at $399 yesterday, so they generally average about $299 with a two-year contract.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, these phones sort of do music but nobody uses them for music because they're not very good and so they end up buying an iPod to go with the phone. We know, we sell the iPod. And so people spend $499 on this combination. What should we charge for iPhone. Because iPhone has got a lot more than this stuff. It's got video. Real video. It's got this beautiful gorgeous wide screen. It's got multi-touch user interface. It's got wi-fi. It's got a real browser. It's got HTML e-mail. It's got coverflow and on and on. And this stuff would normally cost hundreds of dollars.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So how much more than $499 should we price iPhone? Well, we thought long and hard about it, because iPhone just does so much stuff. So much better experience on call, on managing your contacts and visual voice mail. Random access voice mail for the first time. Texting and e-mail and real browser and Google Maps. Tremendous iPod and cover flow and video. What should we price this thing at? Well, for a 4 gigabyte model, we're going to price it at that same $499. No premium whatsoever. $499.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "And we're going to have an 8 gigabyte model for just $599. So we're going to price it starting at $499. Now, when's it going to be available? We're going to be shipping these in June. We're announcing it today because with products like this we've got to go ahead and get FCC approval which takes a few months, and we thought it would be better if we introduced this rather than ask the FCC to introduce it for us. So here we are, and we're going to be shipping it in June in the U.S. We're going to Europe hopefully by the fourth calendar quarter of this year. And in Asia in 2008.\nSo in June, in just a few months, we'll be shipping in the U.S. And when we do, our partner is going to be Cingular. We've chosen Cingular. They are the best and most popular network in the country. 58 million subscribers. They are number one. And they're going to be our exclusive partner in the U.S.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now, it's a unique partnership though. We're not just going to be selling phones and services together. We're going to be doing innovation together. We worked with Cingular on visual voice mail. Because it's an innovation that requires both innovation on the phone and in the network. You can't do it in just one place. You have to do it in both places and collaborate. And so visual voice mail is the first fruit of this collaboration, and you will see more. And when we start shipping in June, we will be selling iPhone through our own stores, and through Cingular stores. And it's my pleasure to introduce the CEO of Cingular, Stan Sigman.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Now as Stan said, we started working together about two years ago and we come from pretty different worlds, the telecommunications industry, the computer industry and of course music with the iPod, and yet we have worked wonderfully together. And we love these guys and we think it's — we're going to bring some great stuff to market over the years together.\nSo let's take a look at this market, and how big it is. My clicker's not working. Oh there it is. So how big is this market, well let's take a look. Clicker is not working. They're scrambling backstage right now.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "You know, when I was in high school, Steve Wozniak and I, mostly Steve, made this little device called the TV jammer. And it was this little oscillator that put out frequencies that would screw up the TV. And Woz would have it in his pocket, and we'd go into like a dorm at Berkeley where he was going to school and bunch of folks will be watching like Star Trek and he'd screw up the TV, and somebody would go up to fix it, and just as they had their foot off the ground, he'd turn it back on. If they put their foot back on the ground he'd screw up the TV again. And within five minutes he'd have somebody like this for the rest of the Star Trek episode.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So game consoles. 26 million game consoles were sold in 2006 worldwide, actually a little smaller than you'd think. It's not such a big market. Digital cameras dwarfed it at 94 million. MP3 players 135 million. And PCs, about 209. Mobile phones, just about a billion last year, worldwide.\nSo what does this tell you? What this tells you is, that 1 percent market share equals 10 million units. This is a giant market. One percent market share, you're going to sell 10 million phones. And this is exactly what we're going to try to do in 2008, our first full year in the market, is grab 1 percent market share and go from there. So we're going to enter a very competitive market, lot of players, we think we're going to have the best product in the world, and we're going to go for it and see if we can get 1 percent market share, 10 million units in 2008, and go from there.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "So, today, we've added to the Mac and the iPod. We've added Apple TV and now iPhone. And you know, the Mac is really the only one that you think of as a computer. Right? And so we've thought about this and we thought, you know, maybe our name should reflect this a little bit more than it does.\nSo we're announcing today we're dropping the computer from our name, and from this day forward, we're going to be known as Apple Inc., to reflect the product mix that we have today.\nI didn't sleep a wink last night. I was so excited about today, because we've been so lucky at Apple. We've had some real revolutionary products. The Mac in 1984 is an experience that those of us that were there will never forget. And I don't think the world will forget it either.\nThe iPod in 2001 changed everything about music, and we're going to do it again with the iPhone in 2007. We're very excited about this.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "There's an old Wayne Gretzky quote that I love. \"I skate to where the puck is going to be, not where it has been\". And we've always tried to do that at Apple. Since the very very beginning. And we always will. So thank you very very much for being a part of this.", "title": "Macworld iPhone Introduction Keynote", "year": "2007", "url": "https://www.youtube.com/watch?v=2MlSJLPxGYs", "sec": "Macworld iPhone Introduction Keynote (2007)"}, {"t": "Hmm. Well, um..I ran into my first computer when I was about 10 or 11. And it’s hard to remember back then. But I’m an old fossil now. I’m an old fossil. So when I was 10 or 11 was about 30 years ago. And no one had ever seen a computer. To the extent that they’d seen them in movies, and they were these big boxes with whirring..For some reason, they fixated on the tape drives as being the icon of what the computer was, or flashing lights somehow. And so nobody had ever seen one. They were very mysterious, very powerful things, that did something in the background. And so, to see one and actually get to use one was a real privilege back then. And I got into NASA, the Ames Research Center down here. I got to use a time-sharing terminal. So I didn’t actually see the computer, but I saw a time-sharing terminal. And in those days.. Again, it’s hard to remember how primitive it was.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "There was no such thing as a computer with a graphics video display. It was literally a printer. It was a teletype printer with a keyboard on it. And so you would keyboard these commands in, and then you would wait for a while, and the thing would go.. And it would tell you something out. But even with that, it was still remarkable, especially for a 10-year-old, that you could write a program in BASIC, let’s say, or FORTRAN. And actually, this machine would take your idea, and it would execute your idea and give you back some results. And if they were the results that you predicted, your program really worked. It was an incredibly thrilling experience. So, I became very captivated by a computer. And a computer, to me, was still a little mysterious,’cause it was at the other end of this wire, and I’d never really seen the actual computer itself.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And then I got tours of computers after that, and saw the insides. And then I was part of this group at Hewlett-Packard. When I was 12, I called up Bill Hewlett, who lived in Hewlett-Packard at the time. And again, this dates me, but there was no such thing as an unlisted telephone number then. So I could just look in the book, and looked his name up. And he answered the phone, and I said, “Hi. My name’s Steve Jobs. You don’t know me, but I’m 12 years old, and I’m building a frequency counter, and I’d like some spare parts.” And so, he talked to me for about 20 minutes. I’ll never forget it as long as I live. And he gave me the parts, but he also gave me a job working at Hewlett-Packard that summer. And I was 12 years old then. And that really made a remarkable influence on me.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Hewlett-Packard was really the only company I’d ever seen in my life at that age, and it formed my view of what a company was, and how well they treated their employees. They didn’t know about cholesterol back then. But at that time, they used to bring a big cartful of donuts and coffee out at 10 every morning. Everybody would take a coffee and donut break. And just little things like that, it was clear that the company recognized that its true value was its employees. So anyway, things led to things with Hewlett-Packard, and I started going up to their Palo Alto research labs every Tuesday night with a small group of people to meet some of their researchers and stuff, and I saw the first desktop computer ever made, which was the Hewlett-Packard 9100. It was about as big as a suitcase, but it actually had a small cathode-ray tube display in it, and it was completely self-contained.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "There was no wire going off behind the curtain somewhere. And I fell in love with it. And you could program it in BASIC and APL. And I would just, for hours, get a ride up to Hewlett-Packard and just hang around that machine and write programs for it. And so that was the early days. And I met Steve Wozniak around that time, too. Well, maybe a little earlier when I was about 14, 15 years old. And we immediately hit it off. He was the first person I’d met that knew more about electronics than I did, and so I was..I liked him a lot, and he was maybe five years older than I. He’d gone off to college and gotten kicked out for pulling pranks, and was living with his parents, and going to De Anza, the local junior college. So we became fast friends, and started doing projects together.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "We read about..We read about the story in Esquire magazine about this guy named Captain Crunch who could supposedly make free telephone calls. You’ve heard about this, I’m sure. And again, we were captivated. How could anybody do this? And we thought it must be a hoax. And we started looking through the libraries, looking for the secret tones that would allow you to do this. And it turned out, we were at Stanford Linear Accelerator Center one night, and way in the bowels of their technical library, way down at the last bookshelf, in the corner bottom rack, we found an AT&T technical journal that laid out the whole thing. And that’s another moment I’ll never forget. When we saw this journal, we thought, “My God! It’s all real.” And so, we set out to build a device to make these tones.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And the way it worked was, you know when you make a long-distance call, you used to hear..(mimicking dial tones) Right? In the background? They were tones that sounded like the touch tone you could make on your phone, but they were a different frequency, so you couldn’t make them. It turned out that, that was the signal from one telephone computer to another controlling the computers in the network. And AT&T made a fatal flaw when they designed the original telephone network, digital telephone network, was they put the signaling from computer to computer in the same band as your voice, which meant that if you could make those same signals, you could put it right in through the handset. And literally, the entire AT&T international phone network would think you were an AT&T computer. So after three weeks we finally built a box like this that worked.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And I remember, the first call we made was down to LA, one of Woz’s relatives down in Pasadena. We dialed the wrong number, but we woke some guy up in the middle of the night, and we were yelling at him like, “Don’t you understand we made this call for free?” And this person didn’t appreciate that. But it was miraculous, and we built these little boxes to do blue boxing, as it was called, and we put a little note in the bottom of them. Our logo was, “He’s got the whole world in his hands.” And they worked. We built the best blue box in the world. It was all digital. No adjustments. And so you could go up to a pay phone and you could take a trunk over to White Plains, and then take a satellite over to Europe, and then go to Turkey, take a cable back to Atlanta. And you could go around the world.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "You could go around the world five or six times ‘cause we learned all the codes for how to get on the satellites and stuff. And then, you could call the pay phone next door, and so you could shout in the phone, and after about a minute, it would come out the other phone. It was.. It was miraculous. And you might ask, “Well, what’s so interesting about that?” What’s so interesting is that we were young. And what we learned was that we could build something ourselves that could control billions of dollars’ worth of infrastructure in the world. That was what we learned, We didn’t know much. We could build a little thing that could control a giant thing. And that was an incredible lesson. I don’t think there would have ever been an Apple computer had there not been blue boxing.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Yeah, we did call the Pope. He pretended to be Henry Kissinger. And we got the number of the Vatican, and we called the Pope. And they started waking people up in the hierarchy. I don’t know, cardinals and this and that. And they actually sent someone to wake up the Pope when, finally, we just burst out laughing, and they realized that we weren’t Henry Kissinger. Yeah, and so, we never got to talk to the Pope, but it was very funny.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Well..Necessity, in the sense that there was time-sharing computers available, and there was a time-sharing company in Mountain View that we could get free time on. So, uh.. But we needed a terminal, and we couldn’t afford one, so we designed and built one. And that was the first thing we ever did. We built this terminal. And so, what an Apple I was, was really an extension of this terminal putting a microprocessor on the back end. That’s what it was. So first we built the terminal, and then we built the Apple I. And we really built it for ourselves because we couldn’t afford to buy anything. And we’d scavenge parts here and there and stuff, and we’d build these all by hand. They’d take 40 to 80 hours to build one, and then they’d always be breaking cause there’s all these tiny little wires. And so, it turned out, a lot of our friends wanted to build them, too.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And although they could scavenge most of the parts as well, they didn’t have the skills to build them that we had acquired by training ourselves through building them. And so, we ended up helping them build most of their computers, and it was really taking up all of our time. And we thought if we could make what’s called a printed circuit board, which is a piece of fiberglass with copper on both sides that’s etched to form the wires so that you could build a computer..You could build an Apple I in a few hours instead of 40 hours. If we only had one of those, we could sell them to all our friends for as much as it cost us to make them, and make our money back. And everybody would be happy, and we’d get a life again. So we did that. I sold my Volkswagen Bus, and Steve sold his calculator, and we got enough money to pay a friend of oursto make the artwork to make a printed circuit board.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And we made some printed circuit boards, and we sold some to our friends. And I was trying to sell the rest of them, so that we could get our Microbus and calculator back. And I walked into the first computer store in the world which was the Byte Shop of Mountain View, I think, on El Camino. It metamorphosized into an adult bookstore a few years later. But at this point, it was the Byte Shop. And the person that ran it, I think his name was Paul Terrell, he said, “I’ll take 50 of those.” I said, “This is great.” He said, “But I want them fully assembled.” We’d never thought of this before. So we then kicked this around, we thought, “Why not? Why not try this?” And so, I spent the next several days on the phone talking with electronics parts distributors. We didn’t know what we were doing. And we said, “Look, here’s the parts we need.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "“We figured we’d buy 100 sets of parts, build 50, sell them to the Byte Shop for twice what it cost us to build them, therefore paying for the whole 100, and then we’d have 50 left, and we could make our profits by selling those. So we convinced these distributors to give us the parts on net 30 days credit. We had no idea what that meant. “Net 30? Sure.” “Sign here.” And then, so we had 30 days to pay them. And so we bought the parts, we built the products, and we sold 50 of them to the Byte Shop in Palo Alto, and got paid in 29 days. And then went and paid off the parts people in 30 days, and so we were in business. But we had the classic Marxian profit realization crisis, in that our profit wasn’t in a liquid currency, our profit was in 50 computers sitting in the corner. So then, all of a sudden, we had to think,”Wow!", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "How are we going to realize our profit?” And so we started thinking about distribution, “Are there any other computer stores?” And we started calling the other computer storesthat we’d heard of across the country, and we just eased into business that way.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "We were designing the Apple II, and we really had much higher ambitions for the Apple II. Woz’s ambitions were, he wanted to add color graphics. My ambition was that..It was very clear to me that while there were a bunch of hardware hobbyists that could assemble their own computers or at least take our board and add the transformers for the power supply, and the case and the keyboard, et cetera, and go get the rest of the stuff. For every one of those, there were a thousand people that couldn’t do that, but wanted to mess around with programing. Software hobbyists. Just like I had been when I was 10, discovering that computer. And so my dream for the Apple II was to sell the first real packaged computer. Packaged personal computer where you didn’t have to be a hardware hobbyist at all. And so, combining both of those dreams, we actually designed the product.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And I found a designer, and we designed the packaging and everything, and we wanted to make it out of plastic, and we had the whole thing ready to go. But we needed some money for tooling the case and things like that. We needed a few hundred thousand dollars. And this was way beyond our means, so I went looking for some venture capital. And I ran across one venture capitalist named Don Valentine who came over to the garage. And he later said I looked like a renegade from the human race. That was his famous quote. And he said he wasn’t willing to invest in us, but he recommended a few people that might, and one of them was Mike Markkula. So I called Mike on the phone, and Mike came over, and Mike had retired at about 30 or 31 from Intel.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "He was a product manager there and had gotten a little bit of stock, and made, like, a million bucks on stock options, which at that time, was quite a lot of money. And he’d been investing in oil and gas deals, and staying home and doing that sort of thing. And he, I think, was kind of antsy to get back into something, and Mike and I hit it off very well. And so Mike said, “Okay, I’ll invest after a few weeks.” And I said, “No. No. We don’t want your money. We want you.” So we convinced Mike to actually throw in with us as an equal partner. And so Mike put in some money, and Mike put in himself, and we took this design that was virtually done with the Apple II, and tooled it up and announced it a few months later at the West Coast Computer Faire.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "It was great. We got the best. The West Coast Computer Faire was small at that time, but to us, it was very large. And so, we had this fantastic booth there. We had a projection television showing the Apple II, and showing its graphics, which today, look very crude, but at that time, were, by far, the most advanced graphics on a personal computer. And I think..My recollection is, we stole the show. And a lot of dealers and distributors started lining up, and we were off and running.\n21.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Throughout the years in business, I found something, which was, I’d always ask why you do things. And the answers you invariably get are,”Oh, that’s just the way it’s done.” Nobody knows why they do what they do. Nobody thinks about things very deeply in business. That’s what I found. I’ll give you an example. When we were building our Apple Is’ in the garage, we knew exactly what they cost. When we got into a factory in the Apple II days, the accounting had this notion of a standard cost, where you’d set a standard cost, and at the end of a quarter, you’d adjust it with a variance.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And I kept asking, “Well, why do we do this?”And the answer was, “Well, that’s just the way it’s done.”And after about six months of digging into this, what I realized was, the reason you do it is because you don’t really have good enough controls to know how much it costs, so you guess, and then you fix your guess at the end of the quarter, and the reason you don’t know how much it costs is because your information systems aren’t good enough. But nobody said it that way. And so, later on, when we designed this automated factory for Macintosh, we were able to get rid of a lot of these antiquated concepts and know exactly what something cost to the second. So in business, a lot of things are.. I call it folklore. They’re done because they were done yesterday and the day before.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And so what that means is, if you’re willing to ask a lot of questions and think about things and work really hard, you can learn business pretty fast. It’s not the hardest thing in the world. It’s not rocket science.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Hmm..See, what we did with them..Well, I’ll give you a simple example. When we were designing our blue box, we wrote a lot of custom programs to help us design it, and to do a lot of the dog work for using terms of calculating master frequencies with sub divisors to get other frequencies and things like that. We used the computer quite a bit. And to calculate how much error we would get in the frequencies, and how much could be tolerated. So, we used them in our work. But much more importantly, it had nothing to do with using them for anything practical. It had to do with using them to be a mirror of your thought process, to actually learn how to think. It was, I think, the greatest value of learning how to..I think everybody in this country should learn how to program a computer, should learn a computer language, because it teaches you how to think. It’s like going to law school.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "I don’t think anybody should be a lawyer, but I think going to law school would actually be useful ‘cause it teaches you how to think in a certain way. In the same way that computer programing teaches you, in a slightly different way, how to think. And so, I view computer science as a liberal art. It should be something that everybody learns. Takes a year in their life, one of the courses they take is learning how to program.\nYou look back and consider itan enriching experience that taught you to think in a different way, or not?", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "It’s very interesting. I was worthabout over $1 million when I was 23, and over $10 million when I was 24, and over $100 million when I was 25. And it wasn’t that important because I never did it for the money. I think money is a wonderful thing because it enables you to do things. It enables you to invest in ideasthat don’t have a short-term payback and things like that. But especially at that point in my life, it was not the most important thing. The most important thing was the company, the people, the products we were making, what we were gonna enable people to do with these products, so I didn’t think about it a great deal. I never sold any stock. Just really believed that the company would do very well over the long term.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "I had 3-4 people who kept bugging me that I ought to get my rear over to Xerox PARC and see what they were doing, and so I finally did. I went over there. And they were very kind, and they showed me what they were working on, and they showed me, But I was so blinded by the first one that One of the things they showed me was object-oriented programing. They showed me that, but I didn’t even see that. The other one they showed me was, really, a network computer system. They had over 100 Alto computers, all networked, using email, et cetera, et cetera. I didn’t even see that. I was so blinded by the first thing they showed me, which was the graphical user interface. I thought it was the best thing I’d ever seen in my life. Now, remember, it was very flawed. What we saw was incomplete. They’d done a bunch of things wrong, but we didn’t know that at the time.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "But still, though, they had..The germ of the idea was there and they’d done it very well. And within 10 minutes, it was obvious to me that all computers would work like this someday. It was obvious. You could argue about how many years it would take, you could argue about who the winners and losers might be, but you couldn’t argue about the inevitability. It was so obvious. You would have felt the same way had you been there.\nNo.\nOh! Oh! You mean they were reluctant to show us the demo?\nOh, okay. Well, I have no idea. But they did show us. So..And it’s good that they showed us, because the technology crashed and burned at Xerox.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Oh, I actually thought a lot about that. And I learned more about that with John Sculley later on, and I think I understand it now pretty well. What happens is, like with John Sculley..John came from PepsiCo, and they, at most, would change their product once every 10 years. To them, a new product was, like, a new-size bottle, right? So if you were a product person, you couldn’t change the course of that company very much. So who influenced the success of PepsiCo? The sales and marketing people. Therefore, they were the ones that got promoted, and therefore, they were the ones that ran the company. Well, for PepsiCo, that might have been okay. But it turns out, the same thing can happen in technology companies that get monopolies. Like, oh, IBM and Xerox. If you were a product person at IBM or Xerox..So you make a better copier or a better computer. So what?", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "When you have a monopoly market share, the company is not any more successful. So the people that can make the company more successful are sales and marketing people, and they end up running the companies. And the product people get driven out of the decision-making forums. And the companies forget what it means to make great products. The product sensibility and the product genius that brought them to that monopolistic position gets rotted out by people running these companies who have no conception of a good product versus a bad product. They have no conception of the craftsmanship that’s required to take a good idea and turn it into a good product. And they really have no feeling in their hearts usually about wanting to really help the customers. So that’s what happened at Xerox.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "The people at Xerox PARC used to call the people that ran Xerox “toner heads.”And they just had..These toner heads would come out to Xerox PARC, and they just had no clue about what they were seeing. Toner is what you put into a copier. The toner that you add to an industrial copier. So basically, they were copier he.. The people at Xerox PARC used to call the people that ran Xerox “toner heads.”And they just had..These toner heads would come out to Xerox PARC, and they just had no clue about what they were seeing. Toner is what you put into a copier. The toner that you add to an industrial copier. So basically, they were copier heads that just had no clue about a computer or what it could do. And so they just grabbed defeat from the greatest victory in the computer industry. Xerox could have owned the entire computer industry today. Could have been a company 10 times its size.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Could have been IBM. Could have been the IBM of the ’90s. Could have been the Microsoft of the ’90s. So..But anyway, that’s all ancient history. It doesn’t really matter anymore.\nOh, sure. Here was Apple, a one-billion-dollar company. And here was IBM, at that time, probably about 30-some-odd-billion-dollar company entering the market. Sure, it was. It was very scary. We made a very big mistake, though. IBM’s first product was terrible. It was really bad. And we made a mistake of not realizing that a lot of other people had a very strong vested interest in helping IBM make it better. So if it had just been up to IBM, they would have crashed and burned. But IBM did have, I think, a genius in their approach, which was to have a lot of other people have a vested interest in their success. And that’s what saved them in the end.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Well, I got our best people together and started to get them working on this. The problem was that we’d hired a bunch of people from Hewlett-Packard. And they didn’t get this idea. They didn’t get it. I remember having dramatic arguments with some of these people who thought the coolest thing in user interface was soft keys at the bottom of a screen. They had no concept of proportionally-spaced fonts, no concept of a mouse. As a matter of fact, I remember arguing with these folks, people screaming at me that it would take us five years to engineer a mouse and it would cost $300 to build. And I finally got fed up. I just went outside and found David Kelley Design, and asked him to design me a mouse. And in 90 days, we had a mouse we could build for 15 bucks that was phenomenally reliable.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "So I found that, in a way, Apple did not have the caliber of people that was necessary to seize this idea in many ways. And there was a core team that did, but there was a larger team that mostly had come from Hewlett-Packard that didn’t have a clue.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Well, no. You know what it is? No, it’s not dark and light. It’s that people get confused. Companies get confused. When they start getting bigger, they want to replicate their initial success. And a lot of them think, “Well, somehow there is some magic in the process of how that success was created.” So they start to try to institutionalize process across the company. And before very long, people get very confused that the process is the content. And that’s, ultimately, the downfall of IBM. IBM has the best process people in the world. They just forgot about the content. And that’s what happened a little bit at Apple, too. We had a lot of people who were great at management process. They just didn’t have a clue as to the content. And in my career, I found that the best people are the ones that really understand the content, and they’re a pain in the butt to manage.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "But you put up with it because they’re so great at the content. And that’s what makes great products. It’s not process. It’s content. So we had a little bit of that problem at Apple. And that problem eventually resulted in the Lisa, which had its moments of brilliance. In a way, it was very far ahead of its time, but there wasn’t enough fundamental content understanding. Apple drifted too far away from its roots. To these Hewlett-Packard guys, $10,000 was cheap. To our market, to our distribution channels, $10,000 was impossible. So we produced a product that was a complete mismatch for the culture of our company, for the image of our company, for the distribution channels of our company, for our current customers. None of them could afford a product like that. And it failed.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Absolutely, and I lost. Well, I thought Lisa was in serious trouble. I thought Lisa was going off in this very bad direction as I’ve just described. And I could not convince enough people in the senior management of Apple that that was the case and we ran the place as a team for the most part. So I lost. And at that point in time.. I brooded for a few months. But it was not very long after that that it really occurred to me that if we didn’t do something here..The Apple II was running out of gas, and we needed to do something with this technology fastor else Apple might cease to exist as the company that it was. And so I formed a small team to do the Macintosh, and we were on a mission from God to save Apple. No one else thought so, but it turned out we were right. And as we evolved the Mac, it became very clear that this was also a way of reinventing Apple. We reinvented everything.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "We reinvented manufacturing. I visited probably 80 automated factories in Japan, and we built the world’s first automated computer factory in the world in California here. So we adopted the 68,000 microprocessor that Lisa had. We negotiated a price that was a fifth of what Lisa was going to pay for it because we were going to use it in much higher volume. And we really started to design this product that could be sold for $1,000 called the Macintosh. And we didn’t make it. We could have sold it at $2,000. Although, we came out at $2,500. And we spent four years of our life doing that. We built the product. We built the automated factory, the machine to build the machine. We built a completely new distribution system. We built a completely different marketing approach. And I think it worked pretty well.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "You know..One of the things that really hurt Apple was after I left, John Sculley got a very serious disease, and that disease.. I’ve seen other people get it, too. It’s the disease of thinking that a really great idea is 90% of the work, and that if you just tell all these other people, “Here is this great idea,” then, of course, they can go off and make it happen. And the problem with that is that there is just a tremendous amount of craftsmanship in between a great idea and a great product. And as you evolve that great idea, it changes and grows. It never comes out like it starts because you learn a lot more as you get into the subtleties of it, and you also find there is tremendous tradeoffs that you have to make. There are just certain things you can’t make electrons do. There are certain things you can’t make plastic do or glass do or factories do or robots do.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And as you get into all these things, designing a product is keeping 5,000 things in your brain, these concepts, and fitting them all together and continuing to push to fit them together in new and different ways to get what you want. And every day you discover something new, that is a new problem or a new opportunity to fit these things together a little differently. And it’s that process that is the magic. And so we had a lot of great ideas when we started. But what I’ve always felt, that a team of people doing something they really believe in is like..When I was a young kid, there was a widowed man that lived up the street. And he was in his 80s. He was a little scary-looking. And I got to know him a little bit. I think he might have paid me to mow his lawn or something. And one day, he said, “Come on into my garage.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "I want to show you something.” And he pulled out this dusty, old rock tumbler. It was a motor and a coffee can and a little band between them. And he said, “Come on with me.” We went out to the back and we got just some rocks. Some regular, old, ugly rocks. And we put them in the can with a little bit of liquid and a little bit of grit powder. And we closed the can up, and he turned this motor on, and he said, “Come back tomorrow.” And this can was making a racket as the stones went around. And I came back the next day, and we opened the can, and we took out these amazingly beautiful polished rocks. The same common stones that had gone in, through rubbing against each other like this, creating a little bit of friction, creating a little bit of noise, had come out these beautiful polished rocks.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And that’s always been, in my mind, my metaphor for a team working really hard on something they’re passionate about is that it’s through the team, through that group of incredibly talented people, bumping up against each other, having arguments, having fights sometimes, making some noise, and working together, they polish each other and they polish the ideas, and what comes out are these really beautiful stones. So it’s hard to explain, and it’s certainly not the result of one person. People like symbols, so I’m the symbol of certain things. But it really was a team effort on the Mac. Now, in my life, I observed something fairly early on at Apple, which..I didn’t know how to explain it then, but I’ve thought a lot about it since. Most things in life, the dynamic range between average and best is at most 2-1.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "If you go to New York City, and you get an average taxicab driver versus the best taxicab driver, you’re probably going to get to your destination with the best taxicab maybe 30% faster. In an automobile, what’s the difference between average and the best? Maybe 20%. The best CD player and an average CD player? I don’t know. 20%. 2-1 is a big dynamic range in most of life. In software, and it used to be the case in hardware, too, the difference between average and the best is 50-to-1, maybe 100-to-1. Very few things in life are like this. But what I was lucky enough to spend my life in, is like this. And so I’ve built a lot of my success off finding these truly gifted people, and not settling for B and C players but really going for the A players, and I found something.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "I found that when you get enough A players together, when you go through the incredible work to find five of these A players, they really like working with each other because they’ve never had a chance to do that before. And they don’t want to work with B and C players. And so it becomes self-policing, and they only want to hire more A players, and so you build up these pockets of A players, and it propagates. And that’s what the Mac team was like. They were all A players. And these were extraordinarily talented people.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Sure. Oh, I think if you talk to a lot of people on the Mac team, they will tell you it was the hardest they’ve ever worked in their life. Some of them will tell you that it was the happiest they’ve ever been in their life. But I think all of them will tell you that is certainly one of the most intense and cherished experiencesthey will ever have in their life. You know, it’s..Some of those things are not sustainable for some people.\nIt usually means their work is shit. Sometimes, it means, “I think your work is shit, and I’m wrong.” But usually, it means their work is not anywhere near good enough.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "No, that’s not usually what I meant. When you get really good people, they know they’re really good, and you don’t have to baby people’s egos so much, and what really matters is the work. And everybody knows that. That’s all that matters is the work. People are being counted on to do specific pieces of the puzzle. And the most important thing, I think, you can do for somebody who is really good and who’s really being counted on is to point out to them when their work isn’t good enough. And to do it very clearly and to articulate why, and to get them back on track. And you need to do that in a way that does not call into question your confidence in their abilities, but leaves not too much room for interpretation that the work that they have done for this particular thing is not good enough to support the goal of the team. And that’s a hard thing to do.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And I’ve always taken a very direct approach. And I think if you talk to people that have worked with me, the really good people have found it beneficial. Some people have hated it. And I’m also one of these people that I don’t really care about being right. I just care about success. So, you’ll find a lot of people that will tell you that I had a very strong opinion and they presented evidence to the contrary, and five minutes later, I completely changed my mind. Because I’m like that. I don’t mind being wrong. I’ll admit that I’m wrong a lot. It doesn’t really matter to me too much. What matters to me is that we do the right thing.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "I don’t know if you know this, but we got the first Canon laser printer engine shipped in the United States at Apple, and we had it hooked up to a Lisa, actually imaging pages before anybody. Before HP. Long before HP, long before Adobe. But I heard a few times, people would tell me, “Hey, there are these guys over in this garage that left Xerox PARC. You ought to go see them.” And I finally went and saw them, and I saw what they were doing, and it was better than what we were doing. And they were gonna be a hardware company. They wanted to make printers and the whole thing. And so I talked them into being a software company. And we had canceled our internal project. And a bunch of people wanted to kill me over this, but we did it. And I had cut a deal with Adobe to use their software, and we bought 19.9% of Adobe at Apple. They needed some financing. We wanted a little bit of control.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And we were off to the races, and so we got the engines from Canon. We designed the first laser printer controller at Apple. And we got the software from Adobe, and we introduced the LaserWriter. And no one at the company wanted to do it but a few of us in the Mac group. Everybody thought a $7,000 printer was crazy. What they didn’t understand was you could share it with AppleTalk. They understood it intellectually, but they didn’t understand it viscerally because the last really expensive thing we tried to sell was Lisa. So we pushed this thing through. And I had to basically do it over a few dead bodies, but we pushed this thing through, and it was the first laser printer on the market, as you know, and the rest is history. When I left Apple, Apple was the largest printer company measured by revenue in the world. It lost that distinction to Hewlett-Packard after I left, unfortunately.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "But when I left, it was the largest printer company in the world.\nYou know..Yes. But.. We also envisioned really a networked office. And so, in January of 1985, when we had our annual meeting and introduced our new products, I made probably the largest marketing blunder of my career by announcing the Macintosh Office instead of just desktop publishing. And we had desktop publishing as a major component of that, but we announced a bunch of other stuff as well, and I think we should have just focused on desktop publishing at that time.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Oh, it was very painful. I’m not even sure I want to talk about it. What can I say? I hired the wrong guy (Sculley). And he destroyed everything I’d spent 10 years working for. Starting with me, but that wasn’t the saddest part. I would have gladly left Apple if Apple would have turned out like I’d wanted it to. He basically got on a rocket ship that was about to leave the pad. And the rocket ship left the pad. And it kind of went to his head. He got confused, and thought that he built the rocket ship. And then he changed the trajectory so that it was inevitably going to crash into the ground.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "Well, what happened was that the industry went into a recession in late 1984. Sales started seriously contracting. And John didn’t know what to do. He had not a clue. And there was a leadership vacuum at the top of Apple. There were fairly strong general managers running the divisions. I was running the Macintosh division, somebody else was running the Apple II division, et cetera. There were some problems with some of the divisions. There was a person running the storage division that was completely out to lunch. And a bunch of things that needed to be changed. But all those problems got put in a pressure cooker because of this contraction in the market place. And there was no leadership. John was in a situation where the board was not happy and where he was probably not long for the company.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "And one thing I did not ever see about John until that time was he had an incredible survival instinct. Somebody once told me, “This guy didn’t get to be the president of PepsiCo without these kinds of instincts.” And it was true. And John decided that a really good person to be the root of all these problems would be me. And so, we came to loggerheads. And John had cultivated a very close relationship with the board. And they believed him. So, that’s what happened.\nOh, clearly. Well, not so much competing visions for the company, ‘cause I don’t think John had a vision for the company.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "It wasn’t an issue of vision. It was an issue of execution. In the sense that my belief was that Apple needed much stronger leadership, to unite these various factions that we had created with the divisions, that the Macintosh was the future of Apple, that we needed to rein back expenses dramatically in the Apple II area, that we needed to be spending very heavily in the Macintosh area. Things like that. And John’s vision was that he should remain the CEO of the company. And anything that would help him do that would be acceptable. I think that Apple was in a state of paralysis in the early part of 1985. And I wasn’t, at that time, capable, I don’t think, of running the company as a whole. I was 30 years old. And I don’t think I had enough experience to run $2billion company. Unfortunately, John didn’t either. So anyway, I was told, in no uncertain terms, that there was no job for me.", "title": "The Lost Interview", "year": "1995", "url": "https://www.youtube.com/watch?v=9m68auPIPRk", "sec": "The Lost Interview (1995)"}, {"t": "It would have been far smarter
