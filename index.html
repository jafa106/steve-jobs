bsarchive.com/", "sec": "“Character is built not in good times, but in bad times.”"}, {"t": "It has helped me in everything I’ve ever done, although I wouldn’t have ever guessed it at the time.\nThe second experience that I remember from Reed is being hungry. All the time. The cafeteria here taught me quickly to be a vegetarian. I didn’t have so much money, so I would gather up Coke bottles and take them up to the store to find out how to eat. I discovered the cheapest way to eat was Roman Meal. Have you ever heard of this? It’s cereal. It was invented by a Harvard professor who was a history professor who one day wondered what the Roman legion took with them to eat as they conquered and pillaged these villages, and he found out through his research that it’s Roman Meal. And you can buy it at the local store, and it’s the cheapest way to live. So I lived for many months on Roman Meal.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“Character is built not in good times, but in bad times.”"}, {"t": "But also, several of us, after not eating for a few days, would hitchhike across town to the Hare Krishna temple on Sundays, where they would feed all comers. Through practice, we discovered just the right moment to arrive—after their particular religious practices and right before the food. And not having eaten for days, we would eat a lot, and on several occasions stay over, because we were not able to move.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“Character is built not in good times, but in bad times.”"}, {"t": "The following morning, they would wake us up at four o’clock in the morning because it was their time to go gather flowers for their temple to honor Krishna. So they would take us with them, predawn, out into the neighborhood—where they would proceed to steal flowers from the neighbors. And the neighbors that lived close to the Hare Krishna temple soon were wise to their pillage and would get up early in the morning and guard their flower beds. And so they would have to go in an ever-wider circumference around their temple. In spending a little time with these people, I noticed some of their other behaviors. They used to sell incense to the local department stores and then go steal it back, so that the department stores would buy more, and they would have a thriving business. And their ethics told them that this was fine, that anything in the service of Krishna was fine.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“Character is built not in good times, but in bad times.”"}, {"t": "In interacting with them, I think I learned more about situational ethics than I ever did on campus.\nThe last experience I wanted to recount for you: there is a man—I think he’s here today—named Jack Dudman, who used to be the dean of the school. He was one of the heroes of my life while I was here, because Jack Dudman looked the other way when I was staying on campus without paying. He looked the other way when I was taking classes without being a formal student and paying the tuition. And oftentimes, when I was at the end of my rope, Jack would go for a walk with me, and I would discover a twenty-dollar bill in my tattered coat pocket after that walk, with no mention of it from Jack before, during, or after.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“Character is built not in good times, but in bad times.”"}, {"t": "I learned more about generosity from Jack Dudman and the people here at this school than I learned anywhere else in my life. So I wanted to thank this community, because the things I learned here stayed with me. Character is built not in good times, but in bad times; not in a time of plenty, but in a time of adversity—and this school seems to manage to nurture that spirit of adversity, and I think does build some character. So I thank you for teaching me how to be hungry and how to keep that with me my whole life.\nThank you very much.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“Character is built not in good times, but in bad times.”"}, {"t": "As Pixar became a leader in graphics, Steve and his mentor, Intel CEO Andy Grove, discussed how Intel might learn from Pixar. When an Intel engineer tried to follow up, Steve resisted.\nFrom: [Engineer 1 at Intel]\nTo: Steve Jobs\nCc: Andy Grove\nSubject: Pixar-3D graphics\nDate: September 22, 1995, 2:04 p.m.\nSteve,\nAndy asked me to look into what we should do in dramatically improving the Intel architecture platform’s 3D graphics performance. He indicated that you and key people at Pixar like Ed Catmull have lots of good ideas on what we should do in this area. I actually contacted Ed several months ago but he was real busy and cannot commit to meeting until after Sept. As you know, I am in charge of microprocessors at Intel.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "I have located several key Intel 3D experts. One of them, [Engineer 2], came from Sun over a year ago. I would like to have a meeting (at Next, Intel or Pixar) with you, Catmull, and others with me and our graphics experts to discuss your ideas and map out what our action plans are. I am in Tokyo next week but will be back in my office on Monday Oct. 2. I will ask my admin to contact your office to set that meeting up.\nThanks.\n[Engineer 1]\nFrom: Steve Jobs\nTo: [Engineer 1]\nSubject: Pixar-3D graphics\nDate: September 23, 1995, 7:11 p.m.\n[Engineer 1],\nPixar does indeed possess the knowledge to enable Intel’s processors to render 3D graphics at much high performance and quality. These “secrets” could definitely make their way into future Intel general purpose processor hardware.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "We believe this single capability is the key for Intel to dramatically enlarge the PCs market share in the consumer market – by significantly surpassing the dedicated gaming machines (Sega, Nintendo, Playstation, etc) graphics capabilities.\nPixar’s secrets were invented through significant investment over ten years or more, and we value them highly. Even without the secrets implemented in the processor, Pixar can gain significant competitive advantage and differentiation through implementing them in software. By disclosing the “correct” way to do high quality, high performance graphics, Pixar will lose much of this to any and all competitors, with no work on their part. Hence, the need for compensation.\nWhat does Intel propose to give Pixar for disclosing and licensing its secrets to Intel?\nSteve", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "From: [Engineer 1]\nTo: Steve Jobs\nCc: Andy Grove\nSubject: Re: Pixar-3D graphics\nDate: September 25, 1995, 11:22 a.m.\nSteve,\nWe would very much like to have our meeting, but I will put that on hold based on your input. We talked to many key people on ideas to improve the microprocessor capability with the aim that this will benefit the whole industry, and everyone will benefit. We have not entered into any financial arrangement in exchange for good ideas for our microprocessors in the past and have no intention for the future.\n[Engineer 1]\nFrom: Steve Jobs\nTo: [Engineer 1]\nCc: Andy Grove\nSubject: Re: Pixar-3D graphics\nDate: September 25, 1995, 5:29 p.m.\nThis approach has not served you well in the past, as evidenced by your poor graphics architectures and performance. Maybe you should think of changing it for the future…\nSteve", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "From: Steve Jobs\nTo: Andy Grove\nSubject: Re: Pixar-3D graphics\nDate: September 25, 1995, 10:27 p.m.\nAndy,\nMaybe it’s just me, but I find [Engineer 1]’s approach extremely arrogant, given Intel’s (his?) dismal showing in understanding computer graphics architectural issues in the past…\nIf I were going to make hundreds of millions of something, I sure as hell would be willing to pay for the best advice money could buy… Any[way], this isn’t a sales pitch; I just wanted you to know what I thought, as always.\nBest,\nSteve\nFrom: Andy Grove\nTo: Steve Jobs\nSubject: Re[2]: Pixar-3D graphics\nDate: September 26, 1995, 3:12 p.m.\nSteve,\nI am firmly on [Engineer 1]’s side on this one. He is taking your offer to help us very seriously, rounded up the best technical people and was ready to go when you introduced a brand new element into the discussion: money.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "You and I have talked many times about this subject; you never suggested or hinted at this being a commercial exchange. I took your offer to help us exactly as that: help, not an offer of a commercial relationship.\nYou may remember, that from time to time I offered suggestions that pertained to your business. Examples range from porting NextStep to the 486 - - which was in our interest too - - to my presentation to your staff on repositioning NextStep beyond that. I am not suggesting that these are comparable in value to your expertise in graphics, but I gave what I had, put some thought into the problem I saw you were facing - - and it never entered my mind to charge for it. In my view, that’s what friendly companies (and friends) do for each other. In the long run, these things balance out.\nI am sorry you don’t feel that way. We will be worse off as a result, and so will the industry.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "Regards,\na\nFrom: Steve Jobs\nTo: Andy Grove\nSubject: Re[2]: Pixar-3D graphics\nDate: October 1, 1995, 3:50 p.m.\nAndy,\nI have many faults, but one of them is not ingratitude. And, I do agree with you that “In the long run, these things balance out.”\nTherefore, I have changed my position 180 degrees - - we will freely help [Engineer 1] make his processors much better for 3D graphics. Please ask [Engineer 1] to call me, and we will arrange for a meeting as soon as the appropriate Pixar technical folks can be freed up from the film.\nThanks for the clearer perspective.\nSteve", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“I have changed my position 180 degrees.”"}, {"t": "From: Steve Jobs\nTo: Pixar\nSubject: Toy Story Crosses $150M !!\nDate: January 2, 1996, 9:30 a.m.\nYesterday Toy Story crossed $150M in domestic box office receipts -- only 13 days after crossing $100M !!\nToy Story was the undisputed blockbuster of the holiday season, topping all other films including Jumanji, Father of the Bride II, Waiting to Exhale and, of course, Balto. Toy Story may even surpass the current 1995 box office leaders, Batman Forever ($184M) and Apollo 13 ($172M), and become the most successful film of 1995.\nToy Story has already become the third most successful animated feature film of all time, topping all of Disney’s classics except “Aladdin” ($217M) and “The Lion King” ($312M).\nTo $175M and beyond!\nCongratulations team,\nSteve", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To $175M and beyond!”"}, {"t": "In 1996, Steve and the Fresh Air radio host Terry Gross looked back on his time at Apple and ahead to the future of the computer industry. They spoke shortly after Pixar’s release of Toy Story and its successful initial public offering. NeXT, meanwhile, continued to struggle.\nTerry Gross: How do you think that the web might change in the near future with the help of the type of software that you are producing now?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "Steve Jobs: I think most large companies and medium-size companies (and even small companies) are starting to look at the web as the ultimate direct-to-customer distribution chain, bypassing all middlemen, going directly from the supplier to the consumer. That’s a pretty powerful concept when you think about it. One of the things that I love is that a very small company, if they invest a lot in their website, can look just as formidable and just as solid on the web as a very large company can. As a matter of fact, some of the smaller companies are more hip on the web, getting more hip to the web sooner, and so they actually look better than some of the large companies do right now. It’s going to be this very leveling phenomenon, but I think a tremendous amount of goods and services is going to be sold, or at least the demand created for such things, over the web.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "TG: What else do you see in the near future for the web, besides the ability to shop in a more kind of complete way through the web?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: It’s not just shopping for goods and services. It’s shopping for information. I mean, you’re going to find out … Already, when I want to find out the movies that are playing around Silicon Valley, I just go up on the local web page and check it out. It’s a lot faster than going through the newspaper, and a lot faster than calling the theaters, et cetera. More and more, we’re shopping for information on the web. I just recently bought a Sony, one of the new Sony camcorders. I went on Sony’s web page, and I found out all about the ones they offer and picked the one I wanted right from that web page before I even called the store to try to find it physically. The demand to get me to buy that thing was created from Sony’s web page. I think we’re going to see more and more of that.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "You’re going to be buying information or finding information, and really making a lot of decisions about what you’re going to do with your life, or what you’re going to purchase, from the web.\nTG: Is the whole idea of going to the store to buy software going to become obsolete, too? Do you think we’ll be downloading our software from the web?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: Of course. Yeah, there’s no question about it. There’s no question that that will happen, and I think it will happen in the next twenty-four months. There’s some software right now that’s still very large. The web on-ramps and off-ramps to corporations are now very fast, but the off-ramps to the consumers’ homes are still not so fast. For buying large software, such as CD-ROM games and stuff, they’ll still be distributed on physical media for a while, but when the off-ramps to the consumer get faster, possibly with cable modems in the near future, then that could possibly go fully electronic as well.\nTG: Tell me what else you see for the web beyond the world of retail.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: There’s a lot of things happening with the web right now, in terms of allowing people access to information that they would just never have before. What this does is, of course, it lets special-interest groups get together. I know people who have had, as an example, a stroke, and have gotten on the web and found that there are several web pages now devoted to information for stroke victims where they can learn about some of the latest treatments. They can learn about avoidance, the latest in avoidance advice, and things like that. Those things didn’t exist before, as well. \nTG: Do you think that when you were ousted from Apple that people kind of wrote you off? I mean, here you are with these big successes now.\nSJ: Oh golly, I don’t know. I’m sure that a lot of people did, and that was fine. It was a very painful time, as you might imagine.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "TG: What, to be forced out of the company you created?\nSJ: Oh, of course. That was a very painful time, but you just march forward, and you try to learn from it. One of the things I always tried to coach myself on was not being afraid to fail. When you have something that doesn’t work out, a lot of times, people’s reaction is to get very protective about never wanting to fall on their face again. I think that’s a big mistake, because you never achieve what you want without falling on your face a few times in the process of getting there. I’ve tried to not be afraid to fail, and, matter of fact, I’ve failed quite a bit since leaving Apple.\nTG: Are you surprised at the problems Apple is having now, or did you see that coming?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: I try not to talk about Apple too much. What I will say is that the day I left Apple, we had a ten-year lead over Microsoft. In the technology business, a ten-year lead is really hard to come by. It happens, maybe a company has that once every few decades, whether it be Xerox or IBM with mainframes. Apple had that with the graphical user interface. The problem at Apple was that they stopped innovating. If you look at the Mac that ships today, it’s 25 percent different than the day I left, and that’s not enough for ten years and billions of dollars in R&D.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "It wasn’t that Microsoft was so brilliant or clever in copying the Mac. It’s that the Mac was a sitting duck for ten years. That’s Apple’s problem, is that their differentiation evaporated. Unlike Compaq, or others who play in the Intel-Microsoft standard space, where they only … Compaq only has to be 5 percent better than its competitors for everyone to want to buy their computers.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "Apple has to be 50 percent or 100 percent better, because when you buy something that is out of the mainstream a little bit, you take a risk, and you want a much bigger reward for taking that risk. […] That differentiation has not completely evaporated, but for the most part it has. That’s the predicament Apple’s in now. That’s why cost-cutting and other things at Apple are not going to be the cure. The cure for Apple is to innovate its way out of its current predicament. There’s a lot of good people left at Apple that are capable of doing that with the proper leadership, which is what’s been missing.\nTG: Some Mac users are afraid that the Mac operating system is in danger of becoming obsolete in the way that Beta video became obsolete because it was outdone by VHS. What do you think?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: I think with the appropriate leadership at Apple, that’s not going to happen, but I think we have to wait and see.\nTG: Do you care? How still involved, invested, do you feel in the future of Apple, the company you co-created?\nSJ: I’m happy every time a Mac gets shipped. I still have people sending me emails, telling me how much they love their Macs. It’s sort of … how do you explain it? It’s like the first person you were ever in love with. You know? It’s like your first love, and there will never be another one like it. In my case, we were together for ten years, and that’s a long time. But if you move on in your life, you can’t always stay in love with your first girlfriend. Right?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "TG: What do you think the state of the computer would be if it weren’t for Apple? This is a chance, I guess, for a really self-serving answer. But, I mean, I’m really curious what you think.\nSJ: I usually believe that if one group of people didn’t do something, within a certain number of years, the times would produce another group of people that would accomplish similar things. We happened to be at the right place, at exactly the right time, with the right group of people. We did some wonderful work. I’m extraordinarily proud of the work that the team at Apple did when I was there. I think that, personally, our major contribution was a little different than some people might think. I think our major contribution was in bringing a liberal arts point of view to the use of computers.\nTG: Yeah, explain what you mean by that.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: What I mean by that is that if you really look at the ease of use of the Macintosh, the driving motivation behind that was to bring—not only ease of use to people so that many, many more people could use computers for nontraditional things at that time—but it was to bring beautiful fonts and typography to people. It was to bring graphics to people, not for plotting laminar flow calculations, but so that they could see beautiful photographs, or pictures, or artwork, et cetera, to help them communicate what they were doing, potentially. Our goal was to bring a liberal arts perspective and a liberal arts audience to what had traditionally been a very geeky technology and a very geeky audience.\nTG: What made you think that that more liberal arts direction was the direction to head in?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: Because in my perspective, and the way I was raised, was that science and computer science is a liberal art. It’s something that everyone should know how to use, at least, and harness in their life. It’s not something that should be relegated to 5 percent of the population over in the corner. It’s something that everybody should be exposed to, everyone should have a mastery of, to some extent, and that’s how we viewed computation, or these computation devices.\nTG: And you think that concept really caught on in the whole industry, eventually?\nSJ: That’s the seed of Apple: computers for the rest of us. I think the liberal arts point of view still lives at Apple. I’m not so sure that it lives that many other places. I mean, one of the reasons I think Microsoft took ten years to copy the Mac was because they didn’t really get it at its core.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "TG: Do you think the PC, as we know it, is on the road of changing?\nSJ: That’s a really big question. I think the PC as we know it is going to be around for quite some time, but the heart of the question is, are we entering a time window where we might see the first successful post-PC devices? Personal digital assistants, or PDAs, attempted to be that and failed.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "The next attempt, I think, is going to be these very low-cost consumer internet appliances. Can somebody make a three-hundred-dollar box that hooks up to your television on one side and maybe hooks up to ISDN or a cable modem on the other side and allows you for, three hundred dollars, to have a web browser on your TV and to access the entire internet? I think that’s entirely possible, and I think that we’re going to see those devices soon, hopefully some innovative marketing and distribution techniques surrounding those devices so that a lot of people can all of a sudden have an internet browser in their living room. I think that’s going to be very exciting, and I think that could be the beginning of the first real post-PC market.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "TG: I know at Apple there was, at least early on, a very informal, non-corporate type of atmosphere. I wonder if there are any lessons you learned about what worked and didn’t work in the corporate lifestyle at Apple that you’ve applied to your current companies, NeXT and Pixar.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "SJ: Well, I don’t know what a corporate lifestyle is. I mean, Apple was a corporation; we were very conscious of that. We were very driven to make money so that we could continue to invest in the things we loved. I would say Apple was a corporate lifestyle, but it had a few very big differences to other corporate lifestyles that I’d seen. The first one was a real belief that there wasn’t a hierarchy of ideas that mapped onto the hierarchy of the organization. In other words, great ideas could come from anywhere and that we better sort of treat people in a much more egalitarian sense, in terms of where the ideas came from.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "And Apple was a very bottoms-up company when it came to a lot of its great ideas. And we hired truly great people and gave them the room to do great work. A lot of companies—I know it sounds crazy—but a lot of companies don’t do that. They hire people to tell them what to do. We hired people to tell us what to do. We figured we’re paying them all this money, their job is to figure out what to do and tell us. And that led to a very different corporate culture, and one that’s really much more collegial than hierarchical.\nTG: In spite of this kind of different approach to the corporate hierarchy, it was probably still a very high-stress place.\nSJ: Well, we were very young, and most of the folks were not married, and so they could work fifteen-hour days. You didn’t have a typical situation where you worked so that you can support your life. Your work was your life, in many cases.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "TG: Right. Do you feel you’ve changed from that? Is that still your life?\nSJ: I feel it is still my life, but it’s not all my life. It’s less of a percentage, but I still don’t really … I’ve never been able to think of my work and my life as different things. They’re the same thing. Where it used to be 99 percent of my life, it’s maybe 50 percent of my life now.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“One of the things I always tried to coach myself on was not being afraid to fail.”"}, {"t": "From: Steve Jobs\nTo: [NeXT Colleagues]\nSubject: White House\nDate: April 2, 1996, 4:17 p.m.\nI am sending you this email from the White House !!\nSteve", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“White House”"}, {"t": "Steve spoke at the Palo Alto High School graduation in June 1996.\nI have been invited here today to address you as you leave high school, and in most cases your parents, too, to venture out into the world on your own. I am supposed to offer you some wisdom and advice that you may remember along your travels.\nI will address my remarks to you, the students, rather than to your parents. It is proper that I do so, being that the only wisdom I have comes from my advanced age; your parents are as old as I am, and much wiser, I am sure.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "However, I am wiser than you, and maybe you will listen to me more than you listen to your parents. Some of your parents may not agree, or agree fully, with what I will say today. This is OK. I will simply be one of the first in your post-high-school life to fill your head with ideas that they disagree with. Wait until you get to college! But, in any event, if there is any discordance between what they have told you and what you hear from me today, rest assured that I am right.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "Be aware of the world’s magical, mystical, and artistic sides. The most important things in life are not the goal-oriented, materialistic things that everyone and everything tries to convince you to strive for. Most of you know that deep inside. Think back on this spring—the last three or four months—when you are winding down high school, know where you are going next year, and begin to really have strong intuitions about the world you will encounter. Maybe you see an image of yourself in Paris, sculpting in an artist’s studio as the setting sun shines in the paned windows. Maybe you’re in India, running a hospital for poor children, and you hear the distant clatter of the outdoor marketplace in the early morning. Maybe you see yourself in a recording studio laying down a track for your album.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "Maybe you see yourself alone in a rented room at 4:30 in the morning being the only person alive to understand a new law of physics you just figured out.\nWhatever it may be, I bet many of you have had some of these intuitive feelings about what you could do with your lives. These feelings are very real, and if nurtured can blossom into something wonderful and magical. A good way to remember these kinds of intuitive feelings is to walk alone near sunset—and spend a lot of time looking at the sky in general. We are never taught to listen to our intuitions, to develop and nurture our intuitions. But if you do pay attention to these subtle insights, you can make them come true.\nPeople will come at you with reasons why you shouldn’t do these things:\nYou can’t make a living writing songs. (Right, just ask Bob Dylan.)", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "Helping children in India is nice, but you need to prepare for real life. (Just ask Mother Teresa.)\nYou could be doing so much more with your life. (You can hear Albert Einstein’s parents encouraging him to get a real job, when he was working a low-level job in the Swiss patent office rather than teaching in a university, so that he could stay up late at night working through his new ideas.)\nIf you don’t have any of these feelings, called dreams, then you’re in trouble. Before you “spend” four or more years of your life going in a direction your heart may or may not want you to go, you need to recapture them.\nBe a creative person. Creativity equals connecting previously unrelated experiences and insights that others don’t see.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "You have to have them to connect them. Creative people feel guilty that they are simply relaying what they “see.” How do you get a more diverse set of experiences? Not by traveling the same path as everyone else …\nI’ll give you an example. The college I went to was a small liberal arts college in Portland, Oregon, named Reed College. It was, at that time, the center of a calligraphy revival movement in the US. I ended up taking a calligraphy course before I left college, and at the age of eighteen was exposed to a totally new world of typography, graphic layout, font design, and the like. There was no hope of earning any income from this skill or knowledge, and some of my friends derided me for wasting my time and talents on learning how to write with “fancy letters.”", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "However, years later, when we were designing the Macintosh, it was this very same experience and set of insights which drove me to insist that we find a way to use proportionally spaced type and offer a range of fonts—in essence, to bring a much richer world of typography to the computer world than had ever existed before. And this also led to the LaserWriter printer, so that one could print these letterforms with the quality they deserved. And this set the stage for “desktop publishing.” I tell you truly: none of this would have ever happened at Apple if I had sacrificed that calligraphy class for a more “substantive” class of economics or engineering.\nSo to be a creative person, you need to “feed” or “invest” in yourself by exploring uncharted paths that are outside the realm of your past experience. Seek out new dimensions of yourself—especially those that carry a romantic scent.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "But one has no way of knowing which of these paths will lead anywhere in advance. That’s the wonderful thing about it, in a way. The only thing one can do is to believe that some of what you follow with your heart will indeed come back to make your life much richer. And it will. And you will gain an ever firmer trust in your instincts and intuition.\nDon’t be a career. The enemy of most dreams and intuitions, and one of the most dangerous and stifling concepts ever invented by humans, is the “Career.” A career is a concept for how one is supposed to progress through stages during the training for and practicing of your working life.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "There are some big problems here. First and foremost is the notion that your work is different and separate from the rest of your life. If you are passionate about your life and your work, this can’t be so. They will become more or less one. This is a much better way to live one’s life.\n[The] risk factor quotient goes down as you encounter the real world. Many [people] find what they believe to be safe harbors (lawyers and accountants), only to wake up ten or fifteen years later and discover the price they paid.\nMake your avocation your vocation. Make what you love your work.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "The journey is the reward. People think that you’ve made it when you’ve gotten to the end of the rainbow and got the pot of gold. But they’re wrong. The reward is in the crossing the rainbow. That’s easy for me to say—I got the pot of gold (literally). But if you get to the pot of gold, you already know that that’s not the reward, and you go looking for another rainbow to cross.\nThink of your life as a rainbow arcing across the horizon of this world. You appear, have a chance to blaze in the sky, then you disappear.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "The two endpoints of everyone’s rainbow are birth and death. We all experience both completely alone. And yet, most people of your age have not thought about these events very much, much less even seen them in others. How many of you have seen the birth of another human? It is a miracle. And how many of you have witnessed the death of a human? It is a mystery beyond our comprehension. No human alive knows what happens to “us” upon or after our death. Some believe this, others that, but no one really knows at all. Again, most people of your age have not thought about these events very much, and it’s as if we shelter you from them, afraid that the thought of mortality will somehow wound you. For me it’s the opposite: to know my arc will fall makes me want to blaze while I am in the sky. Not for others, but for myself, for the trail I know I am leaving.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "Now, as you live your arc across the sky, you want to have as few regrets as possible. Remember, regrets are different from mistakes. Mistakes are those things that you did and wish you could do over again. In some you were a fool (usually concerning women). In others you were scared. In others you hurt someone else. Some mistakes are deep, others not. But if your intent was pure, they are almost always enriching in some way. So mistakes are things that you did and wish you could do over again.\nRegrets are most often things you didn’t do, and wish you did. I still regret not kissing Nancy Kinniman in high school. Who knows what might have happened? Maybe she regrets it too …", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“What you follow with your heart will indeed come back to make your life much richer.”"}, {"t": "On November 22, 1996, Steve discussed leading Pixar, his strategy for the studio’s future, and the privilege of creating stories for future generations.\nQ: What kinds of things did you need to do, both personally (learning to become a filmmaker) and as a businessman, to put the company where it is today?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "Steve Jobs: Well, Pixar is a studio. I’m not a filmmaker. I don’t direct our films. […] What I try to do is help create the environment where all these incredible people can make films. We’ve got a really unique thing in the industry, in that the very best creative people will only go to work at a few places: Disney, Pixar, possibly DreamWorks. In the same sense, the very best computer scientists in computer graphics will only go to work at a few places. Pixar is one of those, but most of the studios are not because they don’t have [our] level of technical culture there. I think Pixar is the only place in the world that can hire the best from both of these areas. And we’ve worked for ten years to figure out a way to have them all work together, which is not easy, because the Hollywood culture and the Silicon Valley culture are really different. We think we’ve picked the best from both.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "Q: I’ve heard that there are no contracts at Pixar, and that’s different than a lot of Hollywood productions. What’s the philosophy behind that?\nSJ: In this blending of [cultures], one of the things that we encountered was that the Hollywood culture and the Silicon Valley culture each use different models of employee retention. Hollywood uses the stick, which is the contract. And Silicon Valley uses the carrot, which is the stock option. We examined both of those in really pretty great detail: economically, but also sort of psychologically and culture-wise. What kind of culture do you end up with?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "And while there’s a lot of reasons to want to lock down your employees for the duration of a film, because if somebody leaves, you know you’re at risk, those same dangers exist in Silicon Valley. During an engineering project, you don’t want to lose people, and yet [Silicon Valley] managed to evolve another system other than contracts. And we prefer the Silicon Valley model in this case: give people stock in the company so that we all have the same goal, which is to create shareholder value.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "But [not having contracts] also makes us constantly worry about making Pixar the greatest company we can, so that nobody would ever want to leave. When you sign a contract with somebody, you can sort of say, “Well, I don’t have to worry about that person for five years.” You know? And if you’re real sophisticated, you’ll have a little database that tickles you six months before their contract’s up so you can start paying them more attention. And they’re the most important person in the world for six months, and then after they sign up again, you put them in a drawer.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "Our system’s a little different than that. Every single day we worry about how we can make Pixar a better company so that nobody will ever want to leave, and so we don’t take anybody for granted. Because if they don’t want to be at Pixar, then probably they should leave anyway—whether or not they would ever have a contract. \nSJ: In technology, and at Pixar on the creative side, you’ve got incredibly talented people who are also rare and in demand. If you don’t treat them right, they can go get another job in ten minutes. Right?\nSo a strange thing happens: the hierarchy of power sort of inverts, and the CEO is actually at the bottom. I sort of feel like I work for most of these people because they’re the ones that are doing all the brilliant work.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "And it’s the same in software. It’s the same thing. The best people are very hard to come by, and so it’s management’s job to support them because they’re on the front lines doing the work. \nQ: How is your relationship with Pixar different than Louis B. Mayer or some of the great studio heads who may not have been directors or producers themselves, but who certainly had a great deal to do with what was done?\nSJ: Well, we’re a small studio, and so we don’t want to let any of this go to our heads.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "What we’re trying to do is to build a great animation studio. We stay very focused on that. The other great animation studio is, of course, Disney. And they’ve done an incredible job. Feature animation is really at the heart of Disney; they’ve created all the character franchises that really breathe life into the theme parks. And if you look at where [Disney’s] profits come from, a tremendous amount of it is dependent on feature animation, as are the theme parks.\nWhat we’re doing is just a pure play to build a feature animation studio. My role is to try to understand the pieces we need to put in place to do that, to work with everybody to attract and retain the people to do that, and to get a clear strategy in place. And [I] help with the relationships with Disney and other people.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "I enjoy it tremendously. We’ve got an incredible collection of people at Pixar, so I learn a lot. I learn a lot. \nSJ: I like to get in there and help where I can. But my greatest joy is when we have people that are much better than I am at something, so I can forget about it, and not worry about it, and get on to something else where I can help. \nSJ: Making an animated film is entirely different than making a live-action film. When you make a live-action film, a director typically shoots between ten and twenty-five times as much footage as will end up on the screen. They take that into the editing room and they build their film. And hopefully they can do a good job, because if they can’t, it’s too late—the actors are gone, the sets are down.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "Walt Disney realized many decades ago that animation was so expensive that you couldn’t afford to animate ten times more than what you need. Matter of fact, you don’t want to animate even 10 percent more than what you need. And therefore, the only conclusion you can come to is, you have to edit your film before you make it. Disney pioneered a lot of techniques for doing that, and they’ve refined those over the last sixty years.\nWorking with Disney gave us access to that wisdom that you can’t buy for love or money: the wisdom and experience of having made tens of feature animated films. And I think we learned a tremendous amount.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "SJ: Ten years ago, when we made the landmark short film Luxo Jr., it took about three hours on average to render each frame. Fast-forward to today. Computers are a hundred times faster, and yet in Toy Story it took three hours on average to render each frame. And the reason was the frames were a hundred times more complex in many cases.\nAnd we’re throwing between five and ten times more computer power at our second feature film, code name Bugs, than we did at Toy Story. And it’ll still take three hours to render each frame. Our ambitions visually are growing as fast as the technology can feed them. And so I think the visual worlds which we’ll be able to create will be much richer over time.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "On the creative side, though, I think the art of storytelling is very old. And no amount of technology can turn a bad story into a good story. […] Storytelling is a real art, and that’s something that we’re always going to be working on very, very hard. I don’t think it’s changed in a long time, and I’m not sure it will. And I don’t think it’s something that the technology has anything to do with.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "SJ: You can hardly find an Apple II around too much anymore. You still can in the schools, but that’s about it. It’s not clear whether you’ll be able to boot up a Macintosh five years from now or not. All these technology boxes and all this software: it has a life of a year or two, if you’re very lucky. If it has a life of five years, it’s extraordinary. And every once in a while, something has a life of ten to fifteen years—and I’ve been lucky to be associated with a few of those products as well. But sooner or later, they all become part of the sedimentary layer that is the foundation for new innovation.\n[By contrast] Disney released its first animated feature film, Snow White, in 1937. That’s sixty years ago. A few years ago, they rereleased it on video and sold 28 million copies, making probably around a quarter billion dollars of profits—sixty years after its initial release!", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "And I have a young son. We got Snow White, and he loved it. He watched it thirty, forty times. And it really struck me that I know people on most of the continents of this world, and I think everyone I know knows the story of Snow White. I don’t think I know one person who hasn’t seen it.\nWatching my son watch this, it really hit me that these stories renew themselves with each generation of young children. You read Joseph Campbell; these are our myths. Here’s something that’s sixty years old that’s regenerating itself in my son and other young children.\nAnd I think people are going to be watching Toy Story in sixty years. Not because of the computer graphics, but because of the story about friendship. And that’s something really amazing to me, something very different than the industry I worked in in the past.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "To have the opportunity to put these stories into the culture like this, if we can work really hard and be lucky again and again, is a rare opportunity. And I think everybody at Pixar feels really, really privileged to have this opportunity.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“To put these stories into the culture … is a rare opportunity.”"}, {"t": "From: Steve Jobs\nTo: Pixar\nSubject: Pixar Holiday Waltz\nDate: December 12, 1996, 4:03 p.m.\nI am told that around 40 of us are feeling uncomfortable coming to the Pixar Holiday Waltz because we don’t have a guest or because we feel it’s a “hoity toity” affair that does not reflect “who we are.”\nI think very few of us belong to the waltz crowd, nor often attend formal affairs like this (my last waltz was ten years ago). That’s exactly why this promises to be so much fun – it’s a chance to see ourselves and our colleagues in a strange costume (tuxedo) doing a totally foreign activity (waltzing). This may be your last chance during this lifetime to see your favorite TD trying to dance in a tuxedo.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The Pixar Holiday Waltz”"}, {"t": "As for being single, all I can say is that cutting in on a lovely lady or elegant gentleman during a waltz is considered proper and flattering. You might also enjoy the food, music, friends and ambience.\nI do hope those of you not planning to attend reconsider joining your friends and colleagues at our Pixar Holiday Waltz. We will miss you if you don’t come. What do you have to lose? You just might love it.\nSteve\nhoity-toity adj (1690)\n1: thoughtlessly silly or frivolous: FLIGHTY\n2: marked by an air of assumed importance: HIGHFALUTIN", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The Pixar Holiday Waltz”"}, {"t": "In the 1990s, when Steve was running NeXT and Pixar, two Stanford Business School students won a lunch with him at a charity auction. They later interviewed him for a book profiling business leaders in technology.\nSteve Jobs: You’d better have great people, or you won’t get your product to market as fast as possible. Or you might get a product to market really fast, but it will be really clunky and nobody will buy it. There are no shortcuts around quality, and quality starts with people. Maybe shortcuts exist, but I’m not smart enough to have ever found any.\nI spend 20 percent of my time recruiting, even now. I spend a day a week helping people recruit. It’s one of the most important things you can do.\nQ: If finding the A players is so important, how can you tell who is an A player and who isn’t?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "SJ: That’s a very hard question. Ultimately there are two paths. If a candidate has been in the workplace for a while, you have to look at the results. There are people who look so good on paper and talk such a good story but have no results behind them. They can’t point to breakthroughs or successful products that they shipped and played an integral part in. Ultimately the results should lead you to the people. As a matter of fact, that’s how I find great people. I look at great results and I find out who was responsible for them.\nHowever, sometimes young people haven’t had the opportunity yet to be in a position of influence to create such results. So here you must evaluate potential. It’s certainly more difficult, but the primary attributes of potential are intelligence and the ability to learn quickly. Much of it is also drive and passion—hard work makes up for a lot.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "When you recruit, you’re rolling the dice. No matter what, you’re rolling the dice because you’ve only got an hour to assess the candidate. The most time I spend with somebody is an hour, and I must then recommend whether we hire the person or not. Others will recommend, too, so I won’t be the only one, but I’ll still have to throw my vote in the hat.\nUltimately it comes down to your gut feeling. Your gut feeling gets refined as you hire more people and see how they do. Some you thought would do well don’t, and you can sense why. If you study it a bit you might say, “I thought this person was going to do well, but I overlooked this aspect,” or, “I didn’t think this person would do well, but they did and here’s why.” As you hire people over time, your gut instinct gets better and more precise.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "Over time, my digging in during an interview gets more precise. For example, many times in an interview I will purposely upset someone: I’ll criticize their prior work. I’ll do my homework, find out what they worked on and say, “God, that really turned out to be a bomb. That really turned out to be a bozo product. Why did you work on that?” I shouldn’t say this in your book, but the worst thing that someone can do in an interview is to agree with me and knuckle under.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "What I look for is for someone to come right back and say, “You’re dead wrong and here’s why.” I want to see what people are like under pressure. I want to see if they just fold or if they have firm conviction, belief, and pride in what they did. It’s also good every once in a while to really piss somebody off in an interview to see how they react because, if your company is a meritocracy of ideas, with passionate people, you have a company with a lot of arguments. If people can’t stand up and argue well under pressure, they may not do well in such an environment. \nQ: What do you think your weaknesses are when it comes to management?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "SJ: I don’t know. People are package deals; you take the good with the confused. In most cases, strengths and weaknesses are two sides of the same coin. A strength in one situation is a weakness in another, yet often the person can’t switch gears. It’s a very subtle thing to talk about strengths and weaknesses because almost always they’re the same thing.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "My strength probably is that I’ve always viewed technology from a liberal arts perspective, from a human culture perspective. As such, I’ve always pushed for things that pulled technology in those directions by bringing insights from other fields. An example of that would be—with the Macintosh—desktop publishing: its proportionately spaced fonts, its ease of use. All of the desktop publishing stuff on the Mac comes from books: the typography, that rich feel that nobody in computers knew anything about. I think that my other strength is that I’m a pretty good judge of people and have the ability to bring people together around common vision.\nQ: Well then, when are your strengths—judgment of character and liberal arts perspective—your weaknesses?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "SJ: In certain cases, my weaknesses are that I’m too idealistic. [I need to] realize that sometimes best is the enemy of better. Sometimes I go for “best” when I should go for “better,” and end up going nowhere or backwards. I’m not always wise enough to know when to go for the best and when to just go for better.\nSometimes I’m blinded by “what could be” versus “what is possible,” doing things incrementally versus doing them in one fell swoop. Balancing the ideal and the practical is something I still must pay attention to.\nQ: In terms of going for the best, you have a widely held reputation of being extremely charismatic—someone who is always able to draw out the best in other people. How have you been able to motivate your employees?", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "SJ: Well, I think that—ultimately, it’s the work that motivates people. I sometimes wish it were me, but it’s not. It’s the work. My job is to make sure the work is as good as it should be and to get people to stretch beyond their best. But it’s ultimately the work that motivates people. That’s what binds them together.\nQ: Yet in the case of the Macintosh, you got tremendous output from people. Regardless of the type of work, not everybody can elicit that type of commitment.\nSJ: Well, I’m not sure I’d chalk that up to charisma. Part of the CEO’s job is to cajole and beg and plead and threaten at times—to do whatever is necessary to get people to see things in a bigger and more profound way than they have, and to do better work than they thought they could do.", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "When they do their best and you don’t think it’s enough, you tell them straight: “This isn’t good enough. I know you can do better. You need to do better. Now go do better.”\nYou must play those cards carefully. You must be right a lot of the time because you’re messing with people’s lives. But that’s part of the job. In the end, it’s the environment you create, the coworkers, and the work that binds. The Macintosh team, if you talk to most of them—a dozen years since we shipped the product—most will still say that working on the Mac was the most meaningful experience of their lives. If we’d never shipped a product they wouldn’t say that. If the product hadn’t been so good they wouldn’t say that. The Macintosh experience wasn’t", "title": "Make Something Wonderful: Steve Jobs in his own words", "year": "2023", "url": "https://book.stevejobsarchive.com/", "sec": "“The worst thing that someone can do in an interview is to agree with me.”"}, {"t": "Well, you know, Bill built the first software company in the industry and I think he built the first software company before anybody really in our industry knew what a software company was, except for these guys. And that was huge. That was really huge. And the business model that they ended up pursuing turned out to be the one that worked really well, you know, for the industry. I think the biggest thing was, Bill was really focused on software before almost anybody else had a clue that it was really the software.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "That’s what I see. I mean, a lot of other things you could say, but that’s the high order bit. And I think building a company’s really hard, and it requires your greatest persuasive abilities to hire the best people you can and keep them at your company and keep them working, doing the best work of their lives, hopefully. And Bill’s been able to stay with it for all these years.\nOne hundred twenty-eight K.\nWe’ve also both been incredibly lucky to have had great partners that we started the companies with and we’ve attracted great people. I mean, so everything that’s been done at Microsoft and at Apple has been done by just remarkable people, none of which are sitting up here today.\nYeah, in a way, we are. In a very tangible way.\nOh, no.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "We had some very strange ads back then. We had one where it was in a kitchen and there was a woman that looked like the wife and she was typing in recipes on the computer with the husband looking on approvingly in the back. Stuff like that.\nI don’t think well.\n’76.\nLet me tell the story. My partner we started out with, this guy named Steve Wozniak. Brilliant, brilliant guy. He writes this BASIC that is, like, the best BASIC on the planet. It does stuff that no other BASIC’s ever done. You don’t have to run it to find your error messages. It finds them when you type it in and stuff. It’s perfect in every way, except for one thing, which is it’s just fixed-point, right? It’s not floating-point.\nSo we’re getting a lot of input that people want this BASIC to be floating-point. And, like, we’re begging Woz, please, please make this floating point.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Well, me. We’re begging Woz to make this floating-point and he just never does it. You know, and he wrote it by hand on paper. I mean, you know, he didn’t have an assembler or anything to write it with. It was all just written on paper and he’d type it in. He just never got around to making it floating-point.\nThis is one of the mysteries of life. I don’t know, but he never did. So, you know, Microsoft had this very popular, really good floating-point BASIC that we ended up going to them and saying “help.”\nYeah. What’s interesting, what’s hard to remember now is that Microsoft wasn’t in the applications business then. They took a big bet on the Mac because this is how they got into the apps business. Lotus dominated the apps business on the PC back then.\nThe OS was bigger than 14K. It was in the 20s somewhere.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "We ship these computers now with, you know, a gigabyte, 2 gigabytes of memory, and nobody remembers 128K.\nWell, Apple did the Mac itself, but we got Bill and his team involved to write these applications. We were doing a few apps ourselves. We did MacPaint, MacDraw and stuff like that, but Bill and his team did some great work.\nGil was a nice guy, but he had a saying. He said, “Apple is like a ship with a hole in the bottom leaking water and my job is to get the ship pointed in the right direction.”\nThank you.\nYou know, Apple was in very serious trouble. And what was really clear was that if the game was a zero-sum game where for Apple to win, Microsoft had to lose, then Apple was going to lose. But a lot of people’s heads were still in that place.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Well, a lot of people’s heads were in that place at Apple and even in the customer base because, you know, Apple had invented a lot of this stuff and Microsoft was being successful and Apple wasn’t and there was jealousy and this and that. There was just a lot of reasons for it that don’t matter.\nBut the net result of it was, was there were too many people at Apple and in the Apple ecosystem playing the game of, for Apple to win, Microsoft has to lose. And it was clear that you didn’t have to play that game because Apple wasn’t going to beat Microsoft. Apple didn’t have to beat Microsoft. Apple had to remember who Apple was because they’d forgotten who Apple was.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "So to me, it was pretty essential to break that paradigm. And it was also important that, you know, Microsoft was the biggest software developer outside of Apple developing for the Mac. So it was just crazy what was happening at that time. And Apple was very weak and so I called Bill up and we tried to patch things up.\nAnd it’s actually–the relationship between the Mac development team at Microsoft and Apple is a great relationship. It’s one of our best developer relationships.\nThe art of those commercials is not to be mean, but it’s actually for the guys to like each other. Thanks. PC guy is great. Got a big heart.\nHis mother loves him.\nWow.\nPC guy’s what makes it all work, actually.\nIt’s worth thinking about.\nAnd we love them because they’re all customers.\nAnd we never ran an ad on that.\nThere were hundreds of them.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "You know, what’s really interesting is–and we talked about this earlier today–if you look at the reason that the iPod exists and the Apple’s in that marketplace, it’s because these really great Japanese consumer electronics companies who kind of own the portable music market, invented it and owned it, couldn’t do the appropriate software, couldn’t conceive of and implement the appropriate software. Because an iPod’s really just software. It’s software in the iPod itself, it’s software on the PC or the Mac, and it’s software in the cloud for the store. And it’s in a beautiful box, but it’s software. If you look at what a Mac is, it’s OS X, right? It’s in a beautiful box, but it’s OS X. And if you look at what an iPhone will hopefully be, it’s software.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And so the big secret about Apple, of course–not-so-big secret maybe–is that Apple views itself as a software company and there aren’t very many software companies left, and Microsoft is a software company. And so, you know, we look at what they do and we think some of it’s really great, and we think a little bit of it’s competitive and most of it’s not. You know, we don’t have a belief that the Mac is going to take over 80% of the PC market. You know, we’re really happy when our market share goes up a point and we love that and we work real hard at it, but Apple’s fundamentally a software company and there’s not a lot of us left and Microsoft’s one of them.\nAlan Kay had a great quote back in the ’70s, I think. He said, “People that love software want to build their own hardware.”\nOh, I can resist that.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Well, before I answer that, let me make a comment on Bill’s answer there, which is, it’s very interesting, in the consumer market and the enterprise market, they’re very different spaces. And in the consumer market, at least, I think one can make a pretty strong case that outside of Windows on PCs, it’s hard to see other examples of the software and hardware being decoupled working super well yet. It might in the phone space over time. It might. But it’s not clear. It’s not clear. You can see a lot more examples of the hardware/software coupling working well.\nSo I think this is one of the reasons we all, you know, come to work every day is because nobody knows the answers to some of these questions. And we’ll find out over the coming years and maybe both will work fine and maybe they won’t.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "Yeah. It’s good to try both approaches. In some product categories–take music players–the solo design worked better. In the PC market, the variety of designs at this stage has a higher share.\nIt’s not that much different than music players the other way around.\nThere’s a lot of things that happened that I’m sure I could have done better when I was at a Apple the first time and a lot of things that happened after I left that I thought were wrong turns, but it doesn’t matter. It really doesn’t matter and you kind of got to let go of that stuff and we are where we are. So we tend to look forward.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And, you know, one of the things I did when I got back to Apple 10 years ago was I gave the museum to Stanford and all the papers and all the old machines and kind of cleared out the cobwebs and said, let’s stop looking backwards here. It’s all about what happens tomorrow. Because you can’t look back and say, well, gosh, you know, I wish I hadn’t have gotten fired, I wish I was there, I wish this, I wish that. It doesn’t matter. And so let’s go invent tomorrow rather than worrying about what happened yesterday.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "I think it’s super healthy right now. I think there’s a lot of young people out there building some great companies who want to build companies, who aren’t just interested in starting something and selling it to one of the big guys, but who want to build companies. And I think there’s some real exciting companies getting built out there. Some next-generation stuff that, you know, some of us play catch-up with and, you know, some of us find ways to partner with and things like that, but there’s a lot of activity out there now, wouldn’t you say?\nI think so, too. There’s a lot of things that are risky right now, which is always a good sign, you know, and you can see through them, you can see to the other side and go, yes, this could be huge, but there’s a period of risk that, you know, nobody’s ever done it before.\nI do, but I can’t say.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "But I can say, when you feel like that, that’s a great thing.\nThat’s what keeps you coming to work in the morning and it tells you there’s something exciting around the next corner.\nWe’re both dinosaurs?\nThat we’re both dinosaurs?", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "I’ll give you a concrete example. I love Google Maps, use it on my computer, you know, in a browser. But when we were doing the iPhone, we thought, wouldn’t it be great to have maps on the iPhone? And so we called up Google and they’d done a few client apps in Java on some phones and they had an API that we worked with them a little on. And we ended up writing a client app for those APIs. They would provide the back-end service. And the app we were able to write, since we’re pretty reasonable at writing apps, blows away any Google Maps client. Just blows it away. Same set of data coming off the server, but the experience you have using it is unbelievable. It’s way better than the computer. And just in a completely different league than what they’d put on phones before.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "And, you know, that client is the result of a lot of technology on the client, that client application. So when we show it to them, they’re just blown away by how good it is. And you can’t do that stuff in a browser.\nSo people are figuring out how to do more in a browser, how to get a persistent state of things when you’re disconnected from a browser, how do you actually run apps locally using, you know, apps written in those technologies so they can be pretty transparent, whether you’re connected or not.\nBut it’s happening fairly slowly and there’s still a lot you can do with a rich client environment. At the same time, the hardware is progressing to where you can run a rich client environment on lower and lower cost devices, on lower and lower power devices. And so there’s some pretty cool things you can do with clients.", "title": "D5 Conference, joint interview with Bill Gates", "year": "2007", "url": "https://www.youtube.com/watch?v=L1pA1LqXqXo", "sec": "D5 Conference, joint interview with Bill Gates (2007)"}, {"t": "What I’m saying is, I think the marriage of some really great client apps with some really great cloud services is incredibly powerful and right now, can be way more powerful than just having a browser on the client.\nI’m saying the marriage of t
